      - $ref: 'common.yaml#/components/parameters/Id'
    get:
      operationId: identityListSupportAccessActions
      summary: List actions taken by the vendor under a grant
      description: |
        Every action under the grant, with vendor user, time and action, visible to the Organisation Admin
        (VC-R6, AC-V01-09.6, AC-V01-09.8, AC-C03-12.7). Auditor reads within scope (PLT-18 AUD = S).
      tags: [Support access]
      x-permission: PLT-18
      x-module: V01
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of logged actions.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [occurred_at, vendor_user_id, action]
                      properties:
                        occurred_at: { $ref: 'common.yaml#/components/schemas/Instant' }
                        vendor_user_id: { $ref: 'common.yaml#/components/schemas/Id' }
                        vendor_user_name: { type: string }
                        action: { type: string }
                        target: { type: [string, 'null'] }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }

components:
  responses:
    OrganisationChoiceRequired:
      description: ORGANISATION_CHOICE_REQUIRED (OQ-C03-05). Candidates carry names and opaque references only.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: 'common.yaml#/components/schemas/Problem'
              - type: object
                required: [choice_token, candidates]
                properties:
                  choice_token: { type: string }
                  candidates:
                    type: array
                    minItems: 2
                    items:
                      type: object
                      required: [candidate_ref, display_name]
                      properties:
                        candidate_ref: { type: string }
                        display_name: { type: string }
    SecondFactorOrUnauthenticated:
      description: UNAUTHENTICATED (wrong credentials) or SECOND_FACTOR_REQUIRED (AC-08) with a challenge token.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: 'common.yaml#/components/schemas/Problem'
              - type: object
                properties:
                  challenge_token: { type: string, description: Present only with SECOND_FACTOR_REQUIRED. }
  schemas:
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access token life in seconds. }
        token_type: { type: string, enum: [Bearer] }
    UserScopeInput:
      type: object
      additionalProperties: false
      required: [scope_kind]
      description: 'AC-07. all → no ids; branch → branch_id; department → department_id (+ department_kind).'
      properties:
        scope_kind: { type: string, enum: [all, branch, department] }
        branch_id: { $ref: 'common.yaml#/components/schemas/Id' }
        department_id: { $ref: 'common.yaml#/components/schemas/Id' }
        department_kind: { type: string, maxLength: 40 }
    UserScope:
      type: object
      required: [scope_kind]
      properties:
        scope_kind: { type: string, enum: [all, branch, department] }
        branch_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        department_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        department_kind: { type: [string, 'null'] }
    UserAccount:
      type: object
      required: [id, login_kind, language, active, roles, scopes]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        login_kind: { type: string, enum: [mobile_otp, password] }
        mobile: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        employee_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        language: { $ref: 'common.yaml#/components/schemas/Language' }
        active: { type: boolean }
        last_sign_in_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        roles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { $ref: 'common.yaml#/components/schemas/Id' }
              name: { type: string }
              system_code: { type: [string, 'null'] }
        scopes: { type: array, items: { $ref: '#/components/schemas/UserScope' } }
    RoleGrant:
      type: object
      additionalProperties: false
      required: [operation_code, grant_kind]
      properties:
        operation_code: { type: string, pattern: '^[A-Z]{3}-[0-9]{2}[a-z]?$', description: PERMISSION_MATRIX code. }
        grant_kind: { type: string, enum: [all, scoped, self, approve] }
        setting_ref: { type: [string, 'null'], maxLength: 20, description: 'Cfg(X) condition, e.g. AC-04.' }
    Role:
      type: object
      required: [id, name, system_code]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        name: { type: string }
        system_code: { type: [string, 'null'], enum: [org_admin, hr_manager, payroll_officer, manager, supervisor, employee, auditor, null] }
        grants: { type: array, items: { $ref: '#/components/schemas/RoleGrant' } }
    RequestType:
      type: string
      enum: [leave, permission, on_duty, regularisation, comp_off, shift_change, punch_flag, period_unlock, settings_change, opening_balance]
    ApproverRule:
      type: object
      required: [request_type, level, source]
      properties:
        request_type: { $ref: '#/components/schemas/RequestType' }
        level: { type: integer, enum: [1, 2] }
        source: { type: string, enum: [reporting_manager, named_user, department_head, hr] }
        named_user_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        updated_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    Delegation:
      type: object
      required: [id, approver_user_id, delegate_user_id, valid_from, valid_to]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        approver_user_id: { $ref: 'common.yaml#/components/schemas/Id' }
        delegate_user_id: { $ref: 'common.yaml#/components/schemas/Id' }
        valid_from: { $ref: 'common.yaml#/components/schemas/Instant' }
        valid_to: { $ref: 'common.yaml#/components/schemas/Instant' }
        created_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
    EmployeeVisibility:
      type: object
      additionalProperties: false
      required: [own_punches, day_status, counters, permission_balance, deduction_reason]
      description: AC-05 items.
      properties:
        own_punches: { type: boolean }
        day_status: { type: boolean }
        counters: { type: boolean }
        permission_balance: { type: boolean }
        deduction_reason: { type: boolean }
    AccessSettings:
      type: object
      required: [delegation_enabled, settings_change_mode, custom_roles_enabled, admin_second_step, employee_visibility]
      description: 'Stored with organisation settings versions (no dedicated table); keys defined here.'
      properties:
        delegation_enabled: { type: boolean, description: AC-03 }
        settings_change_mode: { type: string, enum: [hr_only, hr_with_org_admin_approval], description: AC-04 }
        custom_roles_enabled: { type: boolean, description: AC-06 }
        admin_second_step: { type: boolean, description: AC-08 }
        employee_visibility: { $ref: '#/components/schemas/EmployeeVisibility' }
    SupportAccessState:
      type: string
      enum: [requested, active, rejected, expired, ended]
    SupportAccessGrant:
      type: object
      required: [id, state, vendor_user_id, reason, requested_at]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        state: { $ref: '#/components/schemas/SupportAccessState' }
        vendor_user_id: { $ref: 'common.yaml#/components/schemas/Id' }
        vendor_user_name: { type: string }
        reason: { type: string }
        requested_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        decided_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        decided_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        window_start: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        window_end: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        ended_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
