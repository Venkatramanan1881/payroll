openapi: 3.1.0
info:
  title: Payroll App API - Identity & Access
  version: 1.0.0-draft
  description: |
    Identity & Access context (BRD C03 User access: UM-R1..UM-R4, AC-01..AC-08; MD-03 module visibility; VC-03/VC-R6
    support-access decisions by the Organisation Admin). Organisation always comes from the token (TB-01); sign-in routes
    never take an organisation id. Dated rows are exposed as `valid_from` (inclusive) / `valid_to` (exclusive, null = open).
security:
  - userToken: []
tags:
  - name: Sign-in
  - name: Me
  - name: Users
  - name: Roles
  - name: Approval routing
  - name: Access settings
  - name: Support access
x-exempt-permissions:
  IAM-10: 'Acting as a delegate has no route of its own: it is exercised on each request type''s approve / reject routes, which record on_behalf_of_user_id (AC-03, BR-07).'
paths:
  /v1/auth/otp/request:
    post:
      operationId: identityRequestOtp
      summary: Request a one-time code for a mobile number
      description: |
        Employee sign-in step 1 (UM-R3, AC-C03-04.1). Always answers 202 with the same body whether or not the number is
        on an employee record, so the API never confirms a number exists (AC-C03-04.3, TB-01). Code life, attempts and
        lock-out are OQ-C03-05. Sign-in on the web when the plan excludes the app: OQ-C03-05 / MD-02.
      tags: [Sign-in]
      security: []
      x-permission: SELF-AUTH
      x-module: C03
      x-scope: self
      x-audit: true
      x-events: []
      x-idempotent: natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mobile]
              properties:
                mobile: { type: string, pattern: '^\+[1-9][0-9]{6,14}$', description: E.164 mobile number. }
      responses:
        '202':
          description: If the number is known a code has been sent.
          content:
            application/json:
              schema:
                type: object
                required: [challenge_token, expires_at]
                properties:
                  challenge_token: { type: string, description: Opaque; send back with the code. }
                  expires_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }

  /v1/auth/otp/verify:
    post:
      operationId: identityVerifyOtp
      summary: Verify the one-time code and sign in
      description: |
        Employee sign-in step 2 (UM-R3). Wrong or expired code → 400 OTP_INVALID (AC-C03-04.2). When the mobile number is on
        employee records in more than one organisation, 409 ORGANISATION_CHOICE_REQUIRED returns the candidate organisation
        names with opaque references, and the client completes with `/v1/auth/organisation-choice`. Whether this choice step
        is the final behaviour is OQ-C03-05; the contract stays neutral. Inactive user → 401 (AC-C03-03.7).
      tags: [Sign-in]
      security: []
      x-permission: SELF-AUTH
      x-module: C03
      x-scope: self
      x-audit: true
      x-events: []
      x-idempotent: natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string, maxLength: 2000 }
                code: { type: string, pattern: '^[0-9]{4,8}$' }
                device_label: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/OrganisationChoiceRequired' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }

  /v1/auth/password/sign-in:
    post:
      operationId: identityPasswordSignIn
      summary: Admin sign-in with email and password
      description: |
        Admin users sign in with password (UM-R3). Wrong password → 401 UNAUTHENTICATED (AC-C03-05.4). With AC-08 = on,
        a correct password returns 401 SECOND_FACTOR_REQUIRED with a `challenge_token` and no tokens (AC-C03-05.1);
        with AC-08 = off tokens are returned (AC-C03-05.3). Which roles are "admin users", password rules and lock-out:
        OQ-C03-06. Same email in two organisations → ORGANISATION_CHOICE_REQUIRED (OQ-C03-05). Vendor users are refused
        here (AC-V01-13.3).
      tags: [Sign-in]
      security: []
      x-permission: SELF-AUTH
      x-module: C03
      x-scope: self
      x-audit: true
      x-events: []
      x-idempotent: natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 200 }
                device_label: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Signed in (AC-08 = off).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/SecondFactorOrUnauthenticated' }
        '409': { $ref: '#/components/responses/OrganisationChoiceRequired' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }

  /v1/auth/second-factor/verify:
    post:
      operationId: identityVerifySecondFactor
      summary: Complete the admin second step
      description: |
        AC-08 second step (UM-R3). Failure → 400 OTP_INVALID and no sign-in (AC-C03-05.2). Method of the second step
        (authenticator code per `mfa_secret_enc`) and lock-out: OQ-C03-06.
      tags: [Sign-in]
      security: []
      x-permission: SELF-AUTH
      x-module: C03
      x-scope: self
      x-audit: true
      x-events: []
      x-idempotent: natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string, maxLength: 2000 }
                code: { type: string, pattern: '^[0-9]{6,8}$' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }

  /v1/auth/organisation-choice:
    post:
      operationId: identityChooseOrganisation
      summary: Complete sign-in by choosing one organisation
      description: |
        Neutral organisation-choice step after ORGANISATION_CHOICE_REQUIRED (API_CONVENTIONS §3, OQ-C03-05). The body names
        an opaque `candidate_ref` from that response, never an organisation id (TB-01). If the chosen organisation needs the
        AC-08 second step → 401 SECOND_FACTOR_REQUIRED.
      tags: [Sign-in]
      security: []
      x-permission: SELF-AUTH
      x-module: C03
      x-scope: self
      x-audit: true
      x-events: []
      x-idempotent: natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [choice_token, candidate_ref]
              properties:
                choice_token: { type: string, maxLength: 2000 }
                candidate_ref: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Signed in to the chosen organisation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/SecondFactorOrUnauthenticated' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }

  /v1/auth/refresh:
    post:
      operationId: identityRefreshToken
      summary: Exchange a refresh token for a new token pair
      description: |
        Rotates the refresh token (TSD §8). Revoked, expired or deactivated user → 401 (AC-C03-03.7). Plan without the
        mobile app → 401 for app clients (MD-02, AC-V01-02.2).
      tags: [Sign-in]
      security: []
      x-permission: SELF-AUTH
      x-module: C03
      x-scope: self
      x-audit: false
      x-events: []
      x-idempotent: natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '429': { $ref: 'common.yaml#/components/responses/TooManyRequests' }

  /v1/auth/sign-out:
    post:
      operationId: identitySignOut
      summary: Sign out (revoke this session)
      description: Revokes the current session's refresh token (TSD §8). Repeat is harmless.
      tags: [Sign-in]
      x-permission: AUTHENTICATED
      x-module: C03
      x-scope: self
      x-audit: true
      x-events: []
      x-idempotent: natural
      responses:
        '204': { $ref: 'common.yaml#/components/responses/NoContent' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }

  /v1/me:
    get:
      operationId: identityGetMe
      summary: Get my profile, roles, grants and scope
      description: |
        Own user account, language, roles, effective operation grants and scope, used by clients to build menus
        (UM-R1, AC-01). Grants of disabled modules are left out (MD-03). Employee link if any.
      tags: [Me]
      x-permission: AUTHENTICATED
      x-module: C03
      x-scope: self
      x-audit: false
      x-events: []
      x-idempotent: n/a
      responses:
        '200':
          description: Me.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserAccount'
                  - type: object
                    required: [grants, offered_languages]
                    properties:
                      grants: { type: array, items: { $ref: '#/components/schemas/RoleGrant' } }
                      offered_languages: { type: array, items: { $ref: 'common.yaml#/components/schemas/Language' }, description: OR-03 }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }

  /v1/me/language:
    patch:
      operationId: identityChangeMyLanguage
      summary: Choose my language
      description: |
        UM-R4, OR-03 (AC-C03-06.1..06.3). Only languages switched on in OR-03 are accepted, else VALIDATION_FAILED
        (AC-C03-06.2). What users see when their language is later switched off: OQ-C03-07. While the organisation is suspended
        this is a write, so ORG_SUSPENDED applies (VC-R4).
      tags: [Me]
      x-permission: IAM-11
      x-module: C03
      x-scope: self
      x-audit: true
      x-events: []
      x-idempotent: natural
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: { $ref: 'common.yaml#/components/schemas/Language' }
      responses:
        '200':
          description: Language changed.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/me/modules:
    get:
      operationId: identityListMyModules
      summary: List modules enabled for my organisation today
      description: |
        Module entitlements in force today, read for menus, reports and dashboards (MD-03, AT13, AC-C03-03.5,
        AC-V01-03.1). Read-only for organisation users; switching is vendor-only (MD-01, AC-V01-03.8).
      tags: [Me]
      x-permission: AUTHENTICATED
      x-module: C03
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      responses:
        '200':
          description: Enabled modules.
          content:
            application/json:
              schema:
                type: object
                required: [items, mobile_app]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [module_code, enabled]
                      properties:
                        module_code: { type: string, pattern: '^(V01|C[0-9]{2}|M[0-9]{2})$' }
                        enabled: { type: boolean }
                  mobile_app: { type: boolean, description: 'Plan includes the Android/iOS app (MD-02).' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }

  /v1/users:
    get:
      operationId: identityListUsers
      summary: List user accounts
      description: User accounts with roles and scope (UM-R1, AC-07). Read carries IAM-01 (no separate view row exists).
      tags: [Users]
      x-permission: IAM-01
      x-module: C03
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - name: role_id
          in: query
          schema: { $ref: 'common.yaml#/components/schemas/Id' }
        - name: active
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Email, mobile or name contains.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserAccount' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
    post:
      operationId: identityCreateUser
      summary: Create a user account
      description: |
        Creates a user with login kind, role(s) and scope (UM-R1, UM-R2, UM-R3, AC-07; AC-C03-03.1..03.4).
        `mobile_otp` needs `mobile`; `password` needs `email` and an initial password (DB CHECK). Whether Employee users are
        created automatically for every employee and whether HR may create users: OQ-C03-12 / G-07. Role combinations:
        OQ-C03-03. Combined branch + department scope: OQ-C03-04. Audited (AC-C03-03.6).
      tags: [Users]
      x-permission: IAM-01
      x-module: C03
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login_kind, role_ids, scopes]
              properties:
                login_kind: { type: string, enum: [mobile_otp, password] }
                mobile: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
                email: { type: string, format: email, maxLength: 254 }
                initial_password: { type: string, minLength: 8, maxLength: 200, description: 'Password rules OQ-C03-06.' }
                employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
                language: { $ref: 'common.yaml#/components/schemas/Language' }
                role_ids: { type: array, minItems: 1, uniqueItems: true, items: { $ref: 'common.yaml#/components/schemas/Id' } }
                scopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/UserScopeInput' } }
      responses:
        '201':
          description: User created.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/users/{id}:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    get:
      operationId: identityGetUser
      summary: Get a user account
      description: User with roles and scope (UM-R1, AC-07). IAM-01 read.
      tags: [Users]
      x-permission: IAM-01
      x-module: C03
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      responses:
        '200':
          description: User.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }

  /v1/users/{id}/deactivate:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: identityDeactivateUser
      summary: Deactivate a user account
      description: |
        Removes access; sign-in and existing sessions are refused from then on (all sessions revoked) (UM-R1, N5,
        AC-C03-03.7). What happens automatically at employee exit: OQ-C03-12. Already inactive → 200.
      tags: [Users]
      x-permission: IAM-01
      x-module: C03
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/ReasonRequired' }
      responses:
        '200':
          description: Inactive.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/users/{id}/reactivate:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: identityReactivateUser
      summary: Reactivate a user account
      description: Restores sign-in (UM-R1). Already active → 200. Audited.
      tags: [Users]
      x-permission: IAM-01
      x-module: C03
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/ReasonRequired' }
      responses:
        '200':
          description: Active.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/users/{id}/change-access:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: identityChangeUserAccess
      summary: Replace a user's roles and access scope
      description: |
        Assigns roles and AC-07 scope (UM-R2, AC-07; AC-C03-03.1..03.4). Takes effect on the user's next request
        (scope comes from the token: refresh is forced). Old and new values audited (AC-C03-03.6). HR as actor: G-07.
        Combined scopes: OQ-C03-04. Several roles per person: OQ-C03-03.
      tags: [Users]
      x-permission: IAM-02
      x-module: C03
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_ids, scopes, reason]
              properties:
                role_ids: { type: array, minItems: 1, uniqueItems: true, items: { $ref: 'common.yaml#/components/schemas/Id' } }
                scopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/UserScopeInput' } }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Access changed.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/roles:
    get:
      operationId: identityListRoles
      summary: List roles
      description: System roles (§5, AC-C03-01.1) and custom roles (AC-06) of the organisation only (AC-C03-02.3). IAM-03 read.
      tags: [Roles]
      x-permission: IAM-03
      x-module: C03
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of roles.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Role' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
    post:
      operationId: identityCreateRole
      summary: Create a custom role
      description: |
        AC-06 = on (AC-C03-02.1). With AC-06 = off the action is not available → FORBIDDEN (AC-C03-02.2, matrix Cfg(AC-06)).
        A new role starts with no grants (P9). Names unique per organisation. Custom roles left when AC-06 is later
        switched off: OQ-C03-02. Audited.
      tags: [Roles]
      x-permission: IAM-04
      x-module: C03
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
