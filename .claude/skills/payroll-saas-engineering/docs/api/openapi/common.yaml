openapi: 3.1.0
info:
  title: Payroll App API - shared components
  version: 1.0.0-draft
  description: Components referenced by every context file. See docs/api/API_CONVENTIONS.md.
paths: {}
components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token for an organisation user. Carries user, organisation, roles and scope (TSD §8).
    vendorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token for a vendor user (TSD §4.3).
    jobToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed identity token from Cloud Scheduler / Cloud Tasks (TSD §10).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. Same key + same body returns the stored response; different body returns IDEMPOTENCY_CONFLICT.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last read of the resource.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    EmployeeId:
      name: employee_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    From:
      name: from
      in: query
      schema: { $ref: '#/components/schemas/Date' }
    To:
      name: to
      in: query
      schema: { $ref: '#/components/schemas/Date' }
    BranchFilter:
      name: branch_id
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    DepartmentFilter:
      name: department_id
      in: query
      schema: { $ref: '#/components/schemas/Id' }
  headers:
    ETag:
      description: Version tag of the resource; send back in If-Match.
      schema: { type: string }
  schemas:
    Id: { type: string, format: uuid }
    Date: { type: string, format: date }
    Instant: { type: string, format: date-time, description: RFC 3339 with offset; stored as UTC (BR-11). }
    TimeOfDay: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    Minutes: { type: integer, minimum: 0, description: Duration in whole minutes. }
    DayQuantity: { type: string, pattern: '^-?[0-9]{1,3}\.[0-9]{2}$', description: 'Days as an exact decimal string, e.g. "0.50".' }
    TimeZone: { type: string, description: 'IANA zone name, e.g. Asia/Kolkata.' }
    Language: { type: string, enum: [en, ta, hi] }
    RequestState:
      type: string
      enum: [pending_l1, pending_l2, approved, rejected, cancelled]
      description: SM-REQ. "escalated" is a separate boolean, not a state.
    RequestSummary:
      type: object
      required: [state, escalated]
      properties:
        state: { $ref: '#/components/schemas/RequestState' }
        escalated: { type: boolean }
        decided_basis: { type: [string, 'null'], enum: [approver, auto_on_submit, auto_on_timeout, null] }
        current_approver_user_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        submitted_at: { $ref: '#/components/schemas/Instant' }
    ApprovalDecision:
      type: object
      properties:
        comment: { type: string, maxLength: 1000 }
    RejectionDecision:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ReasonRequired:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ApprovalStep:
      type: object
      required: [level, action, acted_at]
      properties:
        level: { type: integer, enum: [1, 2] }
        action: { type: string, enum: [submitted, approved, rejected, escalated, cancelled, auto_approved, auto_rejected] }
        actor_user_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        on_behalf_of_user_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        comment: { type: [string, 'null'] }
        acted_at: { $ref: '#/components/schemas/Instant' }
    ExplanationStep:
      type: object
      required: [step, rule_ref, outcome]
      description: One step of an explanation (BR-08). Filtered for employees by AC-05.
      properties:
        step: { type: integer }
        rule_ref: { type: string, description: 'BRD rule or setting id, e.g. LA-05, BR-09.' }
        policy_version_id: { $ref: '#/components/schemas/Id' }
        inputs: { type: object, additionalProperties: true }
        outcome: { type: string }
    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: [string, 'null'] }
    Job:
      type: object
      required: [id, kind, state, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed] }
        created_at: { $ref: '#/components/schemas/Instant' }
        finished_at: { oneOf: [ { $ref: '#/components/schemas/Instant' }, { type: 'null' } ] }
        download_url: { type: [string, 'null'], format: uri, description: Short-lived signed link (TB-02). }
        download_expires_at: { oneOf: [ { $ref: '#/components/schemas/Instant' }, { type: 'null' } ] }
        error_report_url: { type: [string, 'null'], format: uri, description: 'Row-level errors for uploads (EM-R7, SH-R2, OB-R3).' }
    FileRef:
      type: object
      required: [path]
      properties:
        path: { type: string, description: 'Storage path returned by an upload link; starts with the organisation (TB-02).' }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable code from docs/api/ERROR_CATALOG.md.
        detail: { type: string }
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    Accepted:
      description: Job accepted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Job' }
    NoContent:
      description: Done.
    BadRequest:
      description: Malformed request or bad one-time code.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthenticated:
      description: UNAUTHENTICATED or SECOND_FACTOR_REQUIRED.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: FORBIDDEN, ORG_SUSPENDED, MODULE_DISABLED or SELF_APPROVAL_FORBIDDEN.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: NOT_FOUND (also used for resources outside the user's scope).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Business-rule conflict (ILLEGAL_TRANSITION, PERIOD_LOCKED, LIMIT_EXCEEDED, IDEMPOTENCY_CONFLICT ...).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionFailed:
      description: PRECONDITION_FAILED (stale ETag).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionRequired:
      description: PRECONDITION_REQUIRED (missing If-Match or Idempotency-Key).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationFailed:
      description: VALIDATION_FAILED with field errors.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: RATE_LIMITED.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
