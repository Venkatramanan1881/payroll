[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
db = { path = "../db" }
axum = "0.8"
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
domain-iam = { path = "../domain-iam" }
domain-workforce = { path = "../domain-workforce" }
domain-sched = { path = "../domain-sched" }
domain-policy = { path = "../domain-policy" }
domain-timecap = { path = "../domain-timecap" }
domain-attendance = { path = "../domain-attendance" }
domain-org = { path = "../domain-org" }
chrono.workspace = true
sha2 = "0.10"
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
argon2 = "0.5"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
