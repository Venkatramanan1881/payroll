[workspace]
resolver = "2"
members = ["backend/crates/*"]

[workspace.dependencies]
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Full debug info for ~15 test binaries linked in parallel exhausted Windows virtual memory (os error 1455)
# and left corrupt build files. Line tables keep file:line in backtraces at a fraction of the memory.
[profile.dev]
debug = "line-tables-only"
