openapi: 3.1.0
info:
  title: Payroll App API - Organisation Structure
  version: 1.0.0-draft
  description: |
    Organisation Structure context (BRD C01 Organisation setup: OR-R1..OR-R5, OR-01..OR-04; EM-01..EM-09 organisation-wide
    settings; PC-R14 geo-fences; PC-05 IP allow list; AC-04 settings approval for organisation settings).
    Organisation always comes from the token (TB-01). Who maintains branches, fences, IP lists, lists and contractors
    (OA, HR or both) is G-11 / OQ-C01-01: the contract carries the matrix code only.
    Dated rows (daterange in the database) are exposed as `valid_from` (inclusive) and `valid_to` (exclusive, null = open).
security:
  - userToken: []
tags:
  - name: Branches
  - name: Geo-fences
  - name: Lists
  - name: Contractors
  - name: Organisation settings
x-exempt-permissions: {}
paths:
  /v1/organisation:
    get:
      operationId: orgGetOwnOrganisation
      summary: Get the signed-in user's organisation
      description: Display name, legal name and state (active / suspended, VC-R4) of the caller's own organisation (TB-01). ORG-07.
      tags: [Organisation settings]
      x-permission: ORG-07
      x-module: C01
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      responses:
        '200':
          description: Own organisation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organisation' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }

  /v1/branches:
    get:
      operationId: orgListBranches
      summary: List branches in scope
      description: |
        Branches visible to the caller after AC-07 scope (AC-C01-01.5, AC-C01-01.8; UM-R2, TB-01). OR-R1.
      tags: [Branches]
      x-permission: ORG-07
      x-module: C01
      x-scope: branch-department
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - name: q
          in: query
          description: Name or code contains.
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name, code, -code] }
      responses:
        '200':
          description: Page of branches.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Branch' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
    post:
      operationId: orgCreateBranch
      summary: Create a branch
      description: |
        Creates a branch with name, code, address and time zone (OR-R1, BR-11). A branch without a time zone is refused
        (AC-C01-01.1, AC-C01-01.3). The time zone becomes the first dated `branch_timezone` row from `time_zone_valid_from`.
        Audited with old/new values (AC-C01-01.7, G9). Actor: G-11 / OQ-C01-01. Refused for roles without the grant (AC-C01-01.6).
      tags: [Branches]
      x-permission: ORG-01
      x-module: C01
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, code, tz, time_zone_valid_from]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                code: { type: string, minLength: 1, maxLength: 20 }
                address: { type: string, maxLength: 500 }
                tz: { $ref: 'common.yaml#/components/schemas/TimeZone' }
                time_zone_valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
      responses:
        '201':
          description: Branch created.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/branches/{id}:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    get:
      operationId: orgGetBranch
      summary: Get a branch
      description: |
        Branch with its current time zone, geo-fences and IP allow list count (OR-R1, AC-C01-01.2). Holiday calendar and
        devices are attached by the scheduling and time-capture contexts. Outside scope → NOT_FOUND (AC-C01-01.5).
      tags: [Branches]
      x-permission: ORG-07
      x-module: C01
      x-scope: branch-department
      x-audit: false
      x-events: []
      x-idempotent: n/a
      responses:
        '200':
          description: Branch.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
    patch:
      operationId: orgUpdateBranch
      summary: Change branch name, code or address
      description: |
        Plain field edits (OR-R1). Time zone is not editable here: it is dated (see change-time-zone, OQ-C01-03).
        Closing a branch is not offered (OQ-C01-02). Audited with old/new values (AC-C01-01.7).
      tags: [Branches]
      x-permission: ORG-01
      x-module: C01
      x-scope: branch-department
      x-audit: true
      x-events: []
      x-idempotent: natural
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                code: { type: string, minLength: 1, maxLength: 20 }
                address: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Branch changed.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/branches/{id}/change-time-zone:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: orgChangeBranchTimeZone
      summary: Change a branch's time zone from a date
      description: |
        Ends the current `branch_timezone` range at `valid_from` and starts a new one (OR-R1, BR-11, G5). Whether punches
        and results already held are re-shown or recalculated in the new zone is OQ-C01-03; the contract records the
        dated change only and does not decide it. A `valid_from` inside a locked period: outcome follows SM-ADJ
        (difference posted as an adjustment, or PERIOD_LOCKED / ADJUSTMENT_WINDOW_EXCEEDED where PL-07 is exceeded,
        OQ-C12-04). Repeating the same zone and date is a no-op (STATE_MACHINES §0). Audited (G9).
      tags: [Branches]
      x-permission: ORG-01
      x-module: C01
      x-scope: branch-department
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tz, valid_from, reason]
              properties:
                tz: { $ref: 'common.yaml#/components/schemas/TimeZone' }
                valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Time zone history after the change.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/branches/{id}/geo-fences:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    get:
      operationId: orgListGeoFences
      summary: List a branch's geo-fences
      description: Fences of the branch with enabled flag and last test (PC-R14, OR-R1, AC-C01-01.2).
      tags: [Geo-fences]
      x-permission: ORG-07
      x-module: C01
      x-scope: branch-department
      x-audit: false
      x-events: []
      x-idempotent: n/a
      responses:
        '200':
          description: Fences.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GeoFence' } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
    post:
      operationId: orgCreateGeoFence
      summary: Set a geo-fence for a branch
      description: |
        HR sets a fence by coordinates or a point picked on a map (PC-R14). A new fence starts switched off so it can be
        tested first. Actor: G-11 (PC-R14 says HR, US-C01-01 says OA). Audited.
      tags: [Geo-fences]
      x-permission: ORG-02
      x-module: C01
      x-scope: branch-department
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeoFenceInput' }
      responses:
        '201':
          description: Fence created (enabled = false).
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoFence' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/geo-fences/{id}:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    patch:
      operationId: orgUpdateGeoFence
      summary: Change a geo-fence's point, radius or name
      description: |
        Edits the fence (PC-R14). A change clears the last test result (`tested_at`) because the tested shape no longer
        exists. Audited with old/new values (G9).
      tags: [Geo-fences]
      x-permission: ORG-02
      x-module: C01
      x-scope: branch-department
      x-audit: true
      x-events: []
      x-idempotent: natural
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: [string, 'null'], maxLength: 120 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                radius_m: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Fence changed.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoFence' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/geo-fences/{id}/test:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: orgTestGeoFence
      summary: Test a fence from here
      description: |
        "Test from the branch before switching it on" (PC-R14). The caller sends the device's current position; the
        server answers whether it falls inside the fence and the distance to its centre, and records `tested_at` /
        `tested_by`. No punch is created. Works whether the fence is on or off. Repeats are harmless.
      tags: [Geo-fences]
      x-permission: ORG-02
      x-module: C01
      x-scope: branch-department
      x-audit: true
      x-events: []
      x-idempotent: natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracy_m: { type: number, minimum: 0, description: Reported location accuracy in metres. }
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                required: [inside, distance_m, tested_at]
                properties:
                  inside: { type: boolean }
                  distance_m: { type: number, minimum: 0, description: Distance from the fence centre. }
                  radius_m: { type: integer }
                  tested_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }

  /v1/geo-fences/{id}/switch-on:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: orgSwitchOnGeoFence
      summary: Switch a geo-fence on
      description: |
        Starts enforcing the fence for app and web punches (PC-R14, PC-R12). PC-R14 says the fence "can" be tested first;
        it does not require a test, so an untested fence is not refused. Already on → 200 with current state.
      tags: [Geo-fences]
      x-permission: ORG-02
      x-module: C01
      x-scope: branch-department
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Fence on.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoFence' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/geo-fences/{id}/switch-off:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: orgSwitchOffGeoFence
      summary: Switch a geo-fence off
      description: Stops enforcing the fence (PC-R14). Already off → 200 with current state. Audited.
      tags: [Geo-fences]
      x-permission: ORG-02
      x-module: C01
      x-scope: branch-department
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Fence off.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoFence' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/branches/{id}/ip-allow-list:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    get:
      operationId: orgGetBranchIpAllowList
      summary: Get a branch's allowed web IP list
      description: Networks from which web punches are accepted when PC-05 = on. ORG-07.
      tags: [Branches]
      x-permission: ORG-07
      x-module: C01
      x-scope: branch-department
      x-audit: false
      x-events: []
      x-idempotent: n/a
      responses:
        '200':
          description: IP list.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IpAllowList' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }

  /v1/branches/{id}/ip-allow-list/change:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: orgChangeBranchIpAllowList
      summary: Replace a branch's allowed web IP list
      description: |
        Replaces the list (PC-05). Matrix marks this `Cfg(AC-04)`: under AC-04 = with Organisation Admin approval the
        response is 202 with a pending settings change and the old list stays in force until approved (AC-C03-09.3);
        otherwise 200. Actor: G-11. Audited (G9).
      tags: [Branches]
      x-permission: ORG-03
      x-module: C01
      x-scope: branch-department
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [networks, reason]
              properties:
                networks:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, maxLength: 43, description: 'IPv4/IPv6 network in CIDR form (column `network`, type cidr).' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: List applied.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IpAllowList' }
        '202':
          description: Pending Organisation Admin approval (AC-04).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsChange' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/lists/{kind}:
    parameters:
      - $ref: '#/components/parameters/ListKind'
    get:
      operationId: orgListListEntries
      summary: List departments, designations, categories or employee types
      description: |
        Entries of one list (OR-R2, OR-R3, OR-R5). Retired entries are hidden unless `include_retired=true`
        (history and reports keep them). Department users see their departments only (AC-C01-02.4).
      tags: [Lists]
      x-permission: ORG-07
      x-module: C01
      x-scope: branch-department
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - name: include_retired
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ListEntry' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
    post:
      operationId: orgCreateListEntry
      summary: Add a list entry
      description: |
        Adds a department, designation, category or employee type; usable on the employee master straight away
        (AC-C01-02.2, AC-C01-03.2; OR-R2, OR-R3, OR-R5). Names are unique per list. Actor: G-11. Audited (AC-C01-02.5).
      tags: [Lists]
      x-permission: ORG-04
      x-module: C01
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                code: { type: string, maxLength: 20 }
      responses:
        '201':
          description: Entry created.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListEntry' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/lists/{kind}/{id}:
    parameters:
      - $ref: '#/components/parameters/ListKind'
      - $ref: 'common.yaml#/components/parameters/Id'
    patch:
      operationId: orgUpdateListEntry
      summary: Change a list entry's name or code
