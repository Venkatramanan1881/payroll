  /v1/organisation-settings:
    get:
      operationId: orgGetOrganisationSettings
      summary: Get organisation settings in force on a date
      description: |
        The `organisation_settings_version` in force on `on` (default today): latest `effective_from` on or before the date
        (DATA_MODEL; G5). OR-01..OR-04, EM-01..EM-08 (AC-C01-05.1).
      tags: [Organisation settings]
      x-permission: ORG-07
      x-module: C01
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - name: 'on'
          in: query
          schema: { $ref: 'common.yaml#/components/schemas/Date' }
      responses:
        '200':
          description: Version in force.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganisationSettingsVersion' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }

  /v1/organisation-settings/versions:
    get:
      operationId: orgListOrganisationSettingsVersions
      summary: List organisation settings versions
      description: All versions, newest `effective_from` first; versions are append-only and never edited (G5, G9, AC-C01-05.6).
      tags: [Organisation settings]
      x-permission: ORG-07
      x-module: C01
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of versions.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrganisationSettingsVersion' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
    post:
      operationId: orgCreateOrganisationSettingsVersion
      summary: Save a new organisation settings version
      description: |
        Saves a complete settings document from `effective_from` with a reason (G5, G9; OR-01..OR-04, EM-01..EM-08).
        A change is always a new row; a future version cannot be edited, only replaced by another version with the same
        date (DATA_MODEL; GAP-SM-16). Languages offered limit what users can choose (AC-C01-05.3).
        Approval path (AC-04): under "HR Manager only" the version is saved and returned with 201 (AC-C03-09.1); under
        "with Organisation Admin approval" a pending settings change is returned with 202 and the old values stay in force
        until approved (AC-C03-09.3). Who approves when one person holds both roles is OQ-C03-11.
        Conflicting values the BRD requires refusing → CONFLICTING_SETTINGS; saved with warnings → `warnings` (SETTINGS_WARNING).
        Back-dating into a locked period: GAP-SM-16 / DP-10 (if refused, PERIOD_LOCKED). Whether OR-01 may change mid-year
        is OQ-C01-07; number formats OQ-C01-08; probation reminder OQ-C02-06; EM-06 scope OQ-C02-11.
        Refused for roles without the grant (AC-C01-05.5).
      tags: [Organisation settings]
      x-permission: ORG-06
      x-module: C01
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [effective_from, reason, schema_version, settings]
              properties:
                effective_from: { $ref: 'common.yaml#/components/schemas/Date' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
                schema_version: { type: integer, minimum: 1 }
                settings: { $ref: '#/components/schemas/OrganisationSettings' }
      responses:
        '201':
          description: Version saved (AC-04 = HR Manager only).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganisationSettingsVersion'
                  - $ref: '#/components/schemas/Warnings'
        '202':
          description: Pending Organisation Admin approval (AC-04 = with approval).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsChange' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/settings-changes:
    get:
      operationId: orgListSettingsChanges
      summary: List settings changes waiting for approval
      description: |
        Organisation and access settings changes held under AC-04 = with Organisation Admin approval (AC-C03-09.3).
        Policy versions have their own approval routes in the policy context. Approvers see changes routed to them
        (AC-02 `settings_change`).
      tags: [Organisation settings]
      x-permission: IAM-08
      x-module: C03
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/SettingsChangeState' }
      responses:
        '200':
          description: Page of settings changes.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SettingsChange' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }

  /v1/settings-changes/{id}/approve:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: orgApproveSettingsChange
      summary: Approve a pending settings change
      description: |
        Organisation Admin approves (AC-04, AC-C03-09.3, AC-C03-09.5); the change is applied from its effective date
        and the history shows who approved. BR-07: the submitter may not approve their own change, including when acting
        as a delegate (AC-03) → SELF_APPROVAL_FORBIDDEN (P5). When one person holds both roles: OQ-C03-11.
        Already approved → 200 with current state; rejected → ILLEGAL_TRANSITION.
      tags: [Organisation settings]
      x-permission: IAM-08
      x-module: C03
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Approved and applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsChange' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/settings-changes/{id}/reject:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: orgRejectSettingsChange
      summary: Reject a pending settings change
      description: |
        Old value stays in force and the submitter sees the rejection (AC-C03-09.4). What the rejected draft becomes
        afterwards is GAP-SM-16 (state `rejected` only is recorded here). BR-07 and the AC-03 delegation case apply as for
        approve → SELF_APPROVAL_FORBIDDEN. Already rejected → 200; approved → ILLEGAL_TRANSITION.
      tags: [Organisation settings]
      x-permission: IAM-08
      x-module: C03
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/RejectionDecision' }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsChange' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

components:
  parameters:
    ListKind:
      name: kind
      in: path
      required: true
      description: 'Maps to `list_entry.kind`: departments → department, designations → designation, categories → category, employee-types → employee_type.'
      schema: { type: string, enum: [departments, designations, categories, employee-types] }
  schemas:
    Organisation:
      type: object
      required: [display_name, legal_name, state, state_changed_at]
      properties:
        display_name: { type: string }
        legal_name: { type: string }
        state: { type: string, enum: [active, suspended] }
        state_changed_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    BranchTimeZone:
      type: object
      required: [tz, valid_from, valid_to]
      properties:
        tz: { $ref: 'common.yaml#/components/schemas/TimeZone' }
        valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
        valid_to: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Date' }, { type: 'null' } ] }
    Branch:
      type: object
      required: [id, name, code, tz, time_zones, created_at, updated_at]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        name: { type: string }
        code: { type: string }
        address: { type: [string, 'null'] }
        tz: { $ref: 'common.yaml#/components/schemas/TimeZone' }
        time_zones: { type: array, items: { $ref: '#/components/schemas/BranchTimeZone' }, description: Dated history (BR-11). }
        holiday_calendar_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        closed_on: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Date' }, { type: 'null' } ], description: Read-only; closing is OQ-C01-02. }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        updated_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    GeoFenceInput:
      type: object
      additionalProperties: false
      required: [latitude, longitude, radius_m]
      properties:
        name: { type: string, maxLength: 120 }
        latitude: { type: number, minimum: -90, maximum: 90, description: 'numeric(9,6)' }
        longitude: { type: number, minimum: -180, maximum: 180, description: 'numeric(9,6)' }
        radius_m: { type: integer, minimum: 1 }
    GeoFence:
      type: object
      required: [id, branch_id, latitude, longitude, radius_m, enabled]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        branch_id: { $ref: 'common.yaml#/components/schemas/Id' }
        name: { type: [string, 'null'] }
        latitude: { type: number }
        longitude: { type: number }
        radius_m: { type: integer }
        enabled: { type: boolean }
        tested_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        tested_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
    IpAllowList:
      type: object
      required: [branch_id, networks]
      properties:
        branch_id: { $ref: 'common.yaml#/components/schemas/Id' }
        networks: { type: array, items: { type: string } }
    ListEntry:
      type: object
      required: [id, kind, name, retired_at]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        kind: { type: string, enum: [department, designation, category, employee_type] }
        name: { type: string }
        code: { type: [string, 'null'] }
        retired_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
    Contractor:
      type: object
      required: [id, name, retired_at]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        name: { type: string }
        contact: { type: [string, 'null'] }
        retired_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
    OrganisationSettings:
      type: object
      additionalProperties: false
      description: |
        Content of `organisation_settings_version.settings` (jsonb). Keys are defined here because no settings schema exists
        yet in docs/database; the core settings schema (TSD §5.4) must adopt them. Defaults per AC-C01-05.1 and G6.
      required: [financial_year, week_start, languages, currency, employee_code_mode, mandatory_fields, contact_self_edit,
                 probation_months, rejoin_code, allowed_branches_mode, non_allowed_branch_punch, other_branch_costing]
      properties:
        financial_year:
          type: object
          additionalProperties: false
          required: [kind]
          description: OR-01. Separate leave year is OQ-C01-07.
          properties:
            kind: { type: string, enum: [calendar_year, april_to_march, custom] }
            custom_start_month: { type: integer, minimum: 1, maximum: 12 }
        week_start: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday], description: OR-02 }
        languages:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: 'common.yaml#/components/schemas/Language' }
          description: OR-03 languages offered.
        currency: { type: string, pattern: '^[A-Z]{3}$', description: 'OR-04 (ISO 4217, default INR). Display only: no money fields in V1.' }
        number_format: { type: string, maxLength: 30, description: OR-04 number format; options OQ-C01-08. }
        employee_code_mode: { type: string, enum: [automatic, manual], description: EM-01 }
        branch_code_prefixes:
          type: object
          description: EM-01 automatic prefix per branch, keyed by branch id.
          additionalProperties: { type: string, maxLength: 10 }
        mandatory_fields: { type: array, uniqueItems: true, items: { type: string, maxLength: 80 }, description: 'EM-02; standard field names or custom field ids (AC-C02-10.2).' }
        contact_self_edit: { type: string, enum: [off, on_with_approval, on_without_approval], description: EM-03 }
        probation_months: { type: integer, minimum: 0, maximum: 60, description: EM-04 }
        confirmation_reminder_days: { type: integer, minimum: 0, description: 'EM-04 reminder lead time; recipient and lead time OQ-C02-06.' }
        rejoin_code: { type: string, enum: [new_code, reuse_old_code], description: EM-05 }
        allowed_branches_mode: { type: string, enum: [master_only, chosen_branches, all_branches], description: 'EM-06; organisation-wide vs per employee OQ-C02-11.' }
        non_allowed_branch_punch: { type: string, enum: [block, record_and_flag], description: EM-07 }
        other_branch_costing: { type: string, enum: [branch_worked, master_branch], description: EM-08 }
    OrganisationSettingsVersion:
      type: object
      required: [id, effective_from, schema_version, settings, created_at]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        effective_from: { $ref: 'common.yaml#/components/schemas/Date' }
        schema_version: { type: integer }
        settings: { $ref: '#/components/schemas/OrganisationSettings' }
        reason: { type: [string, 'null'] }
        created_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    Warnings:
      type: object
      properties:
        warnings:
          type: array
          description: SETTINGS_WARNING items (K4).
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              field: { type: string }
              message: { type: string }
    SettingsChangeState:
      type: string
      enum: [pending, approved, rejected]
      description: 'Local enum: pending settings changes have no table of their own (approval_step request_type settings_change). Outcome after rejection GAP-SM-16.'
    SettingsChange:
      type: object
      required: [id, target, state, submitted_by, submitted_at, effective_from]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        target: { type: string, enum: [organisation_settings, access_settings, employee_visibility, branch_ip_allow_list] }
        target_ref: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        state: { $ref: '#/components/schemas/SettingsChangeState' }
        effective_from: { $ref: 'common.yaml#/components/schemas/Date' }
        reason: { type: string }
        old_value: { type: object, additionalProperties: true }
        new_value: { type: object, additionalProperties: true }
        submitted_by: { $ref: 'common.yaml#/components/schemas/Id' }
        submitted_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        steps: { type: array, items: { $ref: 'common.yaml#/components/schemas/ApprovalStep' } }
