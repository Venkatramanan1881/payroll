    post:
      operationId: orgRetireContractor
      summary: Retire a contractor
      description: |
        Sets `retired_at`; not offered for new links, kept on history (OR-R4, EM-R6). No delete. Retiring a contractor
        that still supplies employees is OQ-C01-04. Already retired → 200 with current state.
      tags: [Contractors]
      x-permission: ORG-05
      x-module: C01
      x-scope: org
