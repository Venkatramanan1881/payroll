openapi: 3.1.0
info:
  title: Payroll App API - Vendor console (Platform)
  version: 1.0.0-draft
  description: |
    Platform context, vendor console (BRD V01: VC-R1..VC-R9, VC-01..VC-05; MD Module control: MD-01..MD-04).
    Vendor routes live under /v1/vendor and take a vendor token (TSD §4.3); organisation users are refused
    (AC-V01-06.4, AC-V01-13.4). Organisation-level facts only, never employee data (P12, AC-V01-06.3, AC-V01-11.5): usage and
    health read the platform summary table `platform.organisation_usage` (written by J10), never client tables.
    Vendor role split (VC-05 full_admin / support / read_only) beyond the matrix VA column is G-01 / OQ-V01-14; read_only
    users may view but every change is refused (AC-V01-13.2). Vendor sign-in is not defined here (OQ-V01-17).
    Dated rows (daterange) are exposed as `valid_from` (inclusive) / `valid_to` (exclusive, null = open).
    Read operations of the console carry PLT-10 (no separate view rows exist for plans, templates or organisations).
security:
  - vendorToken: []
tags:
  - name: Organisations
  - name: Modules
  - name: Usage and health
  - name: Plans
  - name: Sector templates
  - name: Announcements
  - name: Vendor users
  - name: Support access
x-exempt-permissions:
  PLT-09: 'Setting VC-03 has no route until G-04 decides the actor (vendor or Organisation Admin); the data dictionary has no column for VC-03 yet.'
  PLT-16: 'Viewing data under an active SupportAccessGrant is exercised through the normal client routes with a grant-bound token; no route of its own. Extent: G-02 / OQ-V01-12.'
  PLT-17: 'Changing settings or data under a grant is exercised through client routes, if at all: OQ-V01-12 / G-02 is open. Changing results is a fixed denial (P10).'
paths:
  /v1/vendor/organisations:
    get:
      operationId: vendorListOrganisations
      summary: List organisations
      description: Organisations with state, plan and template (VC-R1, VC-R3). Organisation-level facts only (P12).
      tags: [Organisations]
      x-permission: PLT-10
      x-module: V01
      x-scope: vendor
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - name: state
          in: query
          schema: { type: string, enum: [active, suspended] }
        - name: sector_template_id
          in: query
          schema: { $ref: 'common.yaml#/components/schemas/Id' }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Page of organisations.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VendorOrganisation' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
    post:
      operationId: vendorCreateOrganisation
      summary: Create an organisation from a sector template
      description: |
        SM-ORG O1 (VC-R1, MD-01, A1; AC-V01-01.1..01.7). Plan, enabled modules, employee limit and first admin user are all
        required, else VALIDATION_FAILED (AC-V01-01.2). The template is copied into the new organisation (OQ-V01-10); common
        modules C01..C16 in V1 are always on (AC-V01-01.4). The first admin user holds Organisation Admin for this
        organisation only (AC-V01-01.3). May modules / limit differ from the plan: OQ-V01-02 (accepted as given).
        Module dependencies (MD-04) → 409 MODULE_DEPENDENCY_UNMET (proposed code). Audited with template, plan, modules and
        limit (AC-V01-01.7). Vendor-only (AC-V01-01.5).
      tags: [Organisations]
      x-permission: PLT-01
      x-module: V01
      x-scope: vendor
      x-audit: true
      x-events: [OrganisationCreated]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, legal_name, sector_template_id, plan_id, modules, employee_limit, first_admin, subscription]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 200 }
                legal_name: { type: string, minLength: 1, maxLength: 300 }
                sector_template_id: { $ref: 'common.yaml#/components/schemas/Id' }
                plan_id: { $ref: 'common.yaml#/components/schemas/Id' }
                modules: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/ModuleCode' }, description: Optional modules switched on. }
                employee_limit: { $ref: '#/components/schemas/EmployeeLimitInput' }
                first_admin:
                  type: object
                  additionalProperties: false
                  required: [email]
                  properties:
                    email: { type: string, format: email, maxLength: 254 }
                    mobile: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
                    language: { $ref: 'common.yaml#/components/schemas/Language' }
                subscription: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201':
          description: Organisation created (state active).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganisation' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/vendor/organisations/{id}:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    get:
      operationId: vendorGetOrganisation
      summary: Get an organisation's vendor record
      description: |
        State, current plan, modules, employee limit with VC-01, subscription (plan, start, renewal, billing status; VC-R5,
        AC-V01-08.1) and template. No invoices (AC-V01-08.4). No employee data (P12).
      tags: [Organisations]
      x-permission: PLT-10
      x-module: V01
      x-scope: vendor
      x-audit: false
      x-events: []
      x-idempotent: n/a
      responses:
        '200':
          description: Organisation.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganisation' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }

  /v1/vendor/organisations/{id}/change-plan:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: vendorChangeOrganisationPlan
      summary: Change an organisation's plan from a date
      description: |
        VC-R2, MD-02 (AC-V01-04.1, 04.2). Ends the current `organisation_plan` row and starts a new one with reason; history
        rows are never edited. Immediate vs dated effect: OQ-V01-04 (`valid_from` defaults to today). Whether modules and
        limit follow the plan automatically: OQ-V01-02 (not done here; use the module and limit commands).
      tags: [Organisations]
      x-permission: PLT-03
      x-module: V01
      x-scope: vendor
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_id, reason]
              properties:
                plan_id: { $ref: 'common.yaml#/components/schemas/Id' }
                valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Plan changed.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganisation' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/vendor/organisations/{id}/change-employee-limit:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: vendorChangeEmployeeLimit
      summary: Change an organisation's employee limit from a date
      description: |
        VC-R2 (AC-V01-04.1). New dated `employee_limit` row; `max_active` null = no limit. Lowering the limit below the
        current headcount, and whether zero / no limit are allowed: OQ-V01-01 (no employee is deactivated by this command).
        The VC-01 behaviour on reaching the limit is changed by change-vendor-settings and carried forward here.
      tags: [Organisations]
      x-permission: PLT-03
      x-module: V01
      x-scope: vendor
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [max_active, reason]
              properties:
                max_active: { type: [integer, 'null'], minimum: 1 }
                valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Limit changed.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganisation' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/vendor/organisations/{id}/change-vendor-settings:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: vendorChangeVendorSettings
      summary: Set VC-01, VC-02 and VC-04 for an organisation
      description: |
        Vendor console settings (§4.3): VC-01 on reaching the limit (`employee_limit.on_reach`: block / allow_and_alert,
        AC-V01-05.1..05.5); VC-02 renewal reminder N days (`subscription.renewal_reminder_days`, AC-V01-08.3); VC-04 suspension
        (`subscription.auto_suspend_after_days`: null = manual only, AC-V01-07.6, 07.7; "not renewed" OQ-V01-09). VC-03 is
        not here (G-04). Old/new values in the dated history (AC-V01-05.5, G9).
      tags: [Organisations]
      x-permission: PLT-08
      x-module: V01
      x-scope: vendor
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              minProperties: 2
              properties:
                on_reach: { type: string, enum: [block, allow_and_alert], description: VC-01 }
                renewal_reminder_days: { type: integer, minimum: 0, description: VC-02 }
                auto_suspend_after_days: { type: [integer, 'null'], minimum: 0, description: 'VC-04; null = manual only.' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Settings changed.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganisation' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/vendor/organisations/{id}/change-subscription:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: vendorChangeSubscription
      summary: Record subscription details
      description: |
        VC-R5 (AC-V01-08.1, 08.2): start date, renewal date (≥ start), billing status. Billing status values are not defined
        (OQ-V01-11), so it is free text. Invoicing is outside the app (AC-V01-08.4). Kept in the dated history.
      tags: [Organisations]
      x-permission: PLT-05
      x-module: V01
      x-scope: vendor
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SubscriptionInput'
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Subscription recorded.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganisation' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/vendor/organisations/{id}/modules/{module_code}/switch-on:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
      - $ref: '#/components/parameters/ModuleCodePath'
    post:
      operationId: vendorSwitchModuleOn
      summary: Switch an optional module on for an organisation
      description: |
        MD-01, MD-03, VC-R2 (AC-V01-03.1, 03.3, 03.9). New dated `module_entitlement` row with reason. Earlier data of the
        module becomes available again unchanged (AT2). Modules not released in V1 → VALIDATION_FAILED (AC-V01-03.6).
        MD-04: a module whose prerequisite (Payroll) is off → 409 MODULE_DEPENDENCY_UNMET naming the prerequisite
        (AC-V01-03.7; testable from V2). Effective date vs immediate: OQ-V01-04. Already on → 200 with current state.
      tags: [Modules]
      x-permission: PLT-02
      x-module: V01
      x-scope: vendor
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleSwitchInput' }
      responses:
        '200':
          description: Module on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleEntitlement' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/vendor/organisations/{id}/modules/{module_code}/switch-off:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
      - $ref: '#/components/parameters/ModuleCodePath'
    post:
      operationId: vendorSwitchModuleOff
      summary: Switch an optional module off for an organisation
      description: |
        MD-01, MD-03 (AC-V01-03.2, 03.4, 03.9): hidden everywhere, rules not evaluated, data kept. Common modules C01..C16
        cannot be switched off → VALIDATION_FAILED (AC-V01-03.5). MD-04: switching off a prerequisite while a dependant is
        on — blocked or cascaded is OQ-V01-03; if blocked → 409 MODULE_DEPENDENCY_UNMET. In-flight items of the module:
        GAP-SM-17. Recalculation of open days: OQ-V01-04. Already off → 200 with current state.
      tags: [Modules]
      x-permission: PLT-02
      x-module: V01
      x-scope: vendor
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleSwitchInput' }
      responses:
        '200':
          description: Module off.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleEntitlement' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/vendor/organisations/{id}/suspend:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: vendorSuspendOrganisation
      summary: Suspend an organisation
      description: |
        SM-ORG O2: active → suspended with date, vendor user and reason (VC-R4, AC-V01-07.1). From then on organisation users
        can view and export only (AC-V01-07.3, 07.4); device punches are still stored (AC-V01-07.2). App/web punches and
        timed jobs while suspended: OQ-V01-08. Already suspended → 200 with current state (no-op). Organisation users can
        never call this route (AC-V01-07.8).
      tags: [Organisations]
      x-permission: PLT-06
      x-module: V01
      x-scope: vendor
      x-audit: true
      x-events: [OrganisationSuspended]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/ReasonRequired' }
      responses:
        '200':
          description: Suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganisation' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/vendor/organisations/{id}/reactivate:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    post:
      operationId: vendorReactivateOrganisation
      summary: Reactivate a suspended organisation
      description: |
        SM-ORG O4: suspended → active (VC-R4, AC-V01-07.5). Punches received during suspension are present. Already active
        → 200 with current state (no-op).
      tags: [Organisations]
      x-permission: PLT-06
      x-module: V01
      x-scope: vendor
      x-audit: true
      x-events: [OrganisationReactivated]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/ReasonRequired' }
      responses:
        '200':
          description: Active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganisation' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/vendor/organisations/{id}/history:
    parameters:
      - $ref: 'common.yaml#/components/parameters/Id'
    get:
      operationId: vendorListOrganisationHistory
      summary: Dated history of plan, module, limit, vendor-setting, subscription and state changes
      description: |
        VC-R2 (AC-V01-04.1, 04.2, 03.9, 05.5, 08.2): date order, who, old value, new value, reason; entries cannot be edited
        or deleted. Whether the Organisation Admin or Auditor may see this for their own organisation is OQ-V01-05 / G-05
        (no client route until decided).
      tags: [Organisations]
      x-permission: PLT-19
      x-module: V01
      x-scope: vendor
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/HistoryKind' }
      responses:
        '200':
          description: Page of history entries, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, set_at, set_by]
                      properties:
                        kind: { $ref: '#/components/schemas/HistoryKind' }
                        subject: { type: [string, 'null'], description: 'Module code for kind = module.' }
                        old_value: {}
                        new_value: {}
                        valid_from: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Date' }, { type: 'null' } ] }
                        reason: { type: [string, 'null'] }
                        set_by: { $ref: 'common.yaml#/components/schemas/Id' }
                        set_at: { $ref: 'common.yaml#/components/schemas/Instant' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }

  /v1/vendor/usage:
    get:
      operationId: vendorListUsage
      summary: Usage per organisation
      description: |
        VC-R3 (AC-V01-06.1..06.4) from `platform.organisation_usage` only: active employees against the limit, branches,
        devices online, last sign-in (whose: OQ-V01-07), refreshed time. "Last pay run" is not applicable in V1
        (AC-V01-06.2). No employee records, punches or pay data (AC-V01-06.3).
      tags: [Usage and health]
      x-permission: PLT-10
      x-module: V01
      x-scope: vendor
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - name: over_limit
          in: query
          schema: { type: boolean }
