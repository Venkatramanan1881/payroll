    ModuleCode:
      type: string
      pattern: '^(V01|C[0-9]{2}|M[0-9]{2})$'
      description: Module code (BRD §4). C01..C16 are always on and cannot be switched.
    ModuleSwitchInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ModuleEntitlement:
      type: object
      required: [module_code, enabled, valid_from, valid_to, set_by, set_at]
      properties:
        module_code: { $ref: '#/components/schemas/ModuleCode' }
        enabled: { type: boolean }
        valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
        valid_to: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Date' }, { type: 'null' } ] }
        reason: { type: [string, 'null'] }
        set_by: { $ref: 'common.yaml#/components/schemas/Id' }
        set_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    EmployeeLimitInput:
      type: object
      additionalProperties: false
      required: [max_active, on_reach]
      properties:
        max_active: { type: [integer, 'null'], minimum: 1, description: 'null = no limit (OQ-V01-01).' }
        on_reach: { type: string, enum: [block, allow_and_alert], description: 'VC-01, default allow_and_alert.' }
    SubscriptionInput:
      type: object
      additionalProperties: false
      required: [start_date, renewal_date, billing_status]
      properties:
        start_date: { $ref: 'common.yaml#/components/schemas/Date' }
        renewal_date: { $ref: 'common.yaml#/components/schemas/Date' }
        billing_status: { type: string, minLength: 1, maxLength: 40, description: 'Values not defined: OQ-V01-11.' }
        renewal_reminder_days: { type: integer, minimum: 0, description: 'VC-02, default 15.' }
        auto_suspend_after_days: { type: [integer, 'null'], minimum: 0, description: 'VC-04; null = manual only (default).' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    VendorOrganisation:
      type: object
      required: [id, display_name, legal_name, state, state_changed_at, created_at]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        display_name: { type: string }
        legal_name: { type: string }
        state: { type: string, enum: [active, suspended] }
        state_changed_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        state_reason: { type: [string, 'null'] }
        sector_template_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        plan_id: { $ref: 'common.yaml#/components/schemas/Id' }
        modules: { type: array, items: { $ref: '#/components/schemas/ModuleEntitlement' } }
        employee_limit:
          type: object
          properties:
            max_active: { type: [integer, 'null'] }
            on_reach: { type: string, enum: [block, allow_and_alert] }
            valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
        subscription:
          type: object
          properties:
            start_date: { $ref: 'common.yaml#/components/schemas/Date' }
            renewal_date: { $ref: 'common.yaml#/components/schemas/Date' }
            billing_status: { type: string }
            renewal_reminder_days: { type: integer }
            auto_suspend_after_days: { type: [integer, 'null'] }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    HistoryKind:
      type: string
      enum: [plan, module, employee_limit, vendor_settings, subscription, state]
    Plan:
      type: object
      required: [id, code, name, modules, employee_limit, mobile_app]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        modules: { type: array, items: { $ref: '#/components/schemas/ModuleCode' } }
        employee_limit: { type: [integer, 'null'] }
        mobile_app: { type: boolean }
    SectorTemplate:
      type: object
      required: [id, code, name, version, updated_at]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        updated_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    Announcement:
      type: object
      required: [id, title, body, created_by, created_at, organisation_ids]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        title: { type: string }
        body: { type: string }
        created_by: { $ref: 'common.yaml#/components/schemas/Id' }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        organisation_ids: { type: array, items: { $ref: 'common.yaml#/components/schemas/Id' } }
    VendorRole:
      type: string
      enum: [full_admin, support, read_only]
    VendorUser:
      type: object
      required: [id, email, full_name, vendor_role, active]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        email: { type: string }
        full_name: { type: string }
        vendor_role: { $ref: '#/components/schemas/VendorRole' }
        active: { type: boolean }
