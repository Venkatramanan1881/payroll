          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [valid_to, reason]
              properties:
                valid_to: { $ref: 'common.yaml#/components/schemas/Date' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Mapping ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolmentMapping' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
  /v1/enrolments/{employee_id}:
    get:
      operationId: timecapGetEnrolmentStatus
      tags: [Enrolment]
      summary: Get an employee's enrolment status and history
      description: >-
        Current SM-ENROL status (not_enrolled, enrolled, re_enrolment_needed), status history and current mappings (PC-R8).
        Satisfies AC-C04-03.1, AC-C04-03.3, AC-C04-03.6.
      x-permission: TCP-02
      x-module: C04
      x-scope: branch-department
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/EmployeeId'
