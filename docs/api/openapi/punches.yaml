                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /v1/enrolment-mappings/{id}/end:
    post:
      operationId: timecapEndEnrolmentMapping
      tags: [Enrolment]
      summary: End an enrolment mapping
      description: >-
        Ends the mapping's date range at valid_to (inclusive). Whether the employee's status then returns to not enrolled is
        SM-ENROL N5, GAP-SM-04 (left to the server's status history, not decided here). Ending at the same date again returns 200.
      x-permission: TCP-02
      x-module: C04
      x-scope: branch-department
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
