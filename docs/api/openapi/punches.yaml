          description: Manual punches created.
          content:
            application/json:
              schema:
                type: object
                required: [punches]
                properties:
                  punches: { type: array, items: { $ref: '#/components/schemas/PunchRecord' } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
  /v1/device-outages/regularise:
    post:
      operationId: timecapBulkRegulariseDeviceOutage
      tags: [Manual attendance]
      summary: Bulk regularise a device outage
      description: >-
        RG-11 (C06 regularisation): HR corrects all affected days of one branch for a device outage in one command with a reason
        (AC-C06-14.10). Refused with RULE_GROUP_DISABLED when RG-01 or RG-11 is off for the affected employees (G2). Corrections are
        added as manual punches linked to this command (manual_approval_ref), never edits (BR-01); same lock and PL-07 handling as
        timecapRecordManualAttendance (SM-ADJ, OQ-C12-04). Whether a correction may be an override record instead of a punch is the
        C06 regularisation model (SM-REQ §8.2 RegularisationRequest), not decided here.
      x-permission: TCP-05
      x-module: C06
      x-scope: branch-department
      x-audit: true
      x-events: [PunchRecorded]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualAttendanceRequest' }
      responses:
        '201':
          description: Corrections created.
          content:
            application/json:
              schema:
                type: object
                required: [punches]
                properties:
                  punches: { type: array, items: { $ref: '#/components/schemas/PunchRecord' } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/punch-flags:
    get:
      operationId: timecapListPunchFlags
      tags: [Punch flags]
      summary: List punch flags
      description: >-
        Flags the caller may decide, default state = raised (SM-FLAG). Manager sees only employees routed to them (AC-02, AT13);
        each item carries reason, evidence, and the punch (location only with TCP-08; the Manager's need to see location to decide a
        geo flag is G-18). Who decides each reason: G-16 (DP-05, OQ-C04-02). Satisfies AC-C04-15.4, AC-C04-18.2 (list part).
      x-permission: TCP-06
      x-module: C04
      x-scope: team
      x-audit: true
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - { name: state, in: query, schema: { type: string, enum: [raised, accepted, rejected], default: raised } }
        - { name: reason, in: query, schema: { $ref: '#/components/schemas/FlagReason' } }
        - { name: employee_id, in: query, schema: { $ref: 'common.yaml#/components/schemas/Id' } }
        - $ref: 'common.yaml#/components/parameters/BranchFilter'
        - $ref: 'common.yaml#/components/parameters/DepartmentFilter'
        - $ref: 'common.yaml#/components/parameters/From'
        - $ref: 'common.yaml#/components/parameters/To'
      responses:
        '200':
          description: Page of flags, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PunchFlag' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
  /v1/punch-flags/{id}/accept:
    post:
      operationId: timecapAcceptPunchFlag
      tags: [Punch flags]
      summary: Accept a flagged punch
      description: >-
        SM-FLAG F2 Raised → Accepted: the punch counts and the day is recalculated (BR-03, E18, AC-C04-15.1). The punch is unchanged;
        decision, decider and time are recorded against the flag (BR-01, AC-C04-15.2). The approver per reason is G-16 (DP-05,
        OQ-C04-02): the contract only requires TCP-06 plus routing. SELF_APPROVAL_FORBIDDEN (403) when the decider is the punch's
        employee, including when acting as a delegate under AC-03 for that employee's approver (BR-07, AC-C04-15.3).
        Accept on accepted → 200 with current decision, no second recalculation; accept on rejected → ILLEGAL_TRANSITION
        (reversal is GAP-SM-06). Locked date: decision recorded, difference posts to the next open period (SM-ADJ, OQ-C12-10);
        older than PL-07 → ADJUSTMENT_WINDOW_EXCEEDED (OQ-C12-04). Several flags on one punch: GAP-SM-06.
      x-permission: TCP-06
      x-module: C04
      x-scope: team
      x-audit: true
      x-events: [PunchFlagDecided]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Flag accepted (or already accepted).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PunchFlag' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
  /v1/punch-flags/{id}/reject:
    post:
      operationId: timecapRejectPunchFlag
      tags: [Punch flags]
      summary: Reject a flagged punch
      description: >-
        SM-FLAG F3 Raised → Rejected, reason required: the punch stays as evidence and is excluded from the day result; the day is
        recalculated (BR-01, BR-03). Never deletes the punch. Same approver, BR-07 / AC-03 delegation, lock and idempotency rules as
        timecapAcceptPunchFlag (G-16, GAP-SM-06, OQ-C12-10).
      x-permission: TCP-06
      x-module: C04
      x-scope: team
      x-audit: true
      x-events: [PunchFlagDecided]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/RejectionDecision' }
      responses:
        '200':
          description: Flag rejected (or already rejected).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PunchFlag' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

components:
  securitySchemes:
    deviceGateway:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Service identity of the device gateway (Cloud Run service-to-service token). Carries no organisation: the organisation
        comes from the registered device serial (TSD §9.1, PERMISSION_MATRIX P3). Defined locally; candidate for common.yaml.
  responses:
    PunchRefused:
      description: >-
        PUNCH_REFUSED with rule_ref (one of the PC-xx / EM-07 / MD-02 block settings) and the message shown to the employee (E18),
        or VALIDATION_FAILED with field errors.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/PunchRefusedProblem' }
  schemas:
    PunchSource:
      type: string
      enum: [device, app, web, kiosk, import, manual]
      description: 'PC-01 sources. kiosk and import are listed but not described in V1 (OQ-C04-07).'
    RuleRef:
      type: string
      pattern: '^[A-Z]{2}-[0-9]{2}$'
      description: BRD setting that decided the outcome, e.g. PC-13.
    FlagReason:
      type: string
      enum: [outside_fence, branch_not_allowed, no_shift_or_off_day, late_sync, clock_mismatch, location_unavailable, low_accuracy, ip_check_failed]
      description: SM-FLAG reasons (PC-04, EM-07, PC-06, PC-07, PC-08, PC-13, PC-14, PC-05/PC-15).
    Location:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracy_m]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: integer, minimum: 0, description: Accuracy reported by the phone or browser, in metres. }
    PunchCapture:
      type: object
      additionalProperties: false
      required: [idempotency_key, source, client_time, captured_tz]
      description: >-
        One app or web punch as captured. There is deliberately no inside/outside or distance field: the server computes them (TSD §9.2).
      properties:
        idempotency_key: { type: string, format: uuid, description: Client-generated; unique per organisation (TSD §5.5, §9.3). }
        source: { type: string, enum: [app, web] }
        client_time: { $ref: 'common.yaml#/components/schemas/Instant' }
        captured_tz: { $ref: 'common.yaml#/components/schemas/TimeZone' }
        location:
          description: Omitted or null when the client could not read a location (PC-13; app case OQ-C04-10).
          oneOf: [ { $ref: '#/components/schemas/Location' }, { type: 'null' } ]
        location_unavailable_reason: { type: [string, 'null'], enum: [permission_denied, no_fix, not_supported, null] }
        selfie: { $ref: 'common.yaml#/components/schemas/FileRef' }
        client_ref: { type: string, maxLength: 200, description: App install or browser identifier. }
    OfflinePunch:
      type: object
      additionalProperties: false
      required: [idempotency_key, client_time, captured_tz, device_uptime_ms]
      properties:
        idempotency_key: { type: string, format: uuid }
        client_time: { $ref: 'common.yaml#/components/schemas/Instant', description: Phone clock at capture. }
        captured_tz: { $ref: 'common.yaml#/components/schemas/TimeZone' }
        device_uptime_ms: { type: integer, minimum: 0, description: Phone uptime-clock reading at capture (TSD §9.3). }
        location: { oneOf: [ { $ref: '#/components/schemas/Location' }, { type: 'null' } ] }
        location_unavailable_reason: { type: [string, 'null'], enum: [permission_denied, no_fix, not_supported, null] }
        selfie: { $ref: 'common.yaml#/components/schemas/FileRef' }
        client_ref: { type: string, maxLength: 200 }
    OfflineSyncBatch:
      type: object
      additionalProperties: false
      required: [sync_client_time, sync_uptime_ms, punches]
      properties:
        sync_client_time: { $ref: 'common.yaml#/components/schemas/Instant', description: Phone clock at the moment of sync. }
        sync_uptime_ms: { type: integer, minimum: 0, description: Phone uptime-clock reading at the moment of sync. }
        punches:
          type: array
          minItems: 1
          maxItems: 500
          description: Item-level problems are reported per item in the results, not as a 422 for the batch.
          items: { $ref: '#/components/schemas/OfflinePunch' }
    ItemProblem:
      type: [object, 'null']
      required: [code]
      properties:
        code: { type: string, enum: [PUNCH_REFUSED, VALIDATION_FAILED, DEVICE_UNKNOWN, ADJUSTMENT_WINDOW_EXCEEDED] }
        rule_ref: { $ref: '#/components/schemas/RuleRef' }
        message: { type: string, description: Localised message shown to the employee (E18, N7). }
        errors:
          type: array
          items:
            type: object
            required: [code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    BatchItemResult:
      type: object
      required: [idempotency_key, outcome]
      properties:
        idempotency_key: { type: string }
        outcome: { type: string, enum: [accepted, duplicate, flagged, refused] }
        code: { type: [string, 'null'], enum: [DUPLICATE_PUNCH, null], description: Set for duplicate. }
        punch_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        flags: { type: array, items: { $ref: '#/components/schemas/FlagReason' } }
        refusal: { $ref: '#/components/schemas/ItemProblem' }
    DevicePunchRecord:
      type: object
      additionalProperties: false
      required: [device_record_id, enrolment_id, event_time, received_at, raw_payload_ref]
      properties:
        device_record_id: { type: string, minLength: 1, maxLength: 128, description: Record identifier from the device log; with the device it is the idempotency key. }
        enrolment_id: { type: string, minLength: 1, maxLength: 64 }
        event_time:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?$'
          description: >-
            Device time exactly as sent. Without an offset it is read in the device branch's time zone (BR-11). Whether eSSL sends an
            offset is an adapter concern (Q15 / D1).
        received_at: { $ref: 'common.yaml#/components/schemas/Instant', description: Gateway receipt time. }
        raw_payload_ref: { type: string, maxLength: 500, description: Storage path of the saved raw payload; starts with the organisation (TB-02). }
    DevicePunchBatch:
      type: object
      additionalProperties: false
      required: [device_serial, records]
      properties:
        device_serial: { type: string, minLength: 1, maxLength: 64 }
        records: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/DevicePunchRecord' } }
    PunchLocation:
      type: [object, 'null']
      description: Null when not captured or when the caller lacks TCP-08 (G-18).
      properties:
        latitude: { type: number }
        longitude: { type: number }
        accuracy_m: { type: [integer, 'null'] }
        fence_distance_m: { type: [integer, 'null'], description: Server-computed distance to the nearest applicable fence (PC-R13). }
        inside_fence: { type: [boolean, 'null'], description: Server-computed (TSD §9.2). }
    PunchFlagSummary:
      type: object
      required: [id, reason, state]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        reason: { $ref: '#/components/schemas/FlagReason' }
        state: { type: string, enum: [raised, accepted, rejected] }
        counts_before_decision: { type: boolean, description: DP-05. }
    PunchRecord:
      type: object
      required: [id, source, event_at, captured_tz, received_at, is_manual, flags]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        employee_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ], description: Null only for an unattributed device punch (OQ-C04-04). }
        source: { $ref: '#/components/schemas/PunchSource' }
        event_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        captured_tz: { $ref: 'common.yaml#/components/schemas/TimeZone' }
        received_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        branch_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        device_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        enrolment_id: { type: [string, 'null'] }
        client_ref: { type: [string, 'null'] }
        direction_tag: { type: [string, 'null'], enum: [in, out, null], description: Only when the source itself provides one (BRX-01). }
        device_uptime_ms: { type: [integer, 'null'] }
        is_manual: { type: boolean }
        manual_reason: { type: [string, 'null'] }
        manual_entered_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        manual_approval_ref: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ], description: Approver reference (G-17). }
        has_selfie: { type: boolean }
        location: { $ref: '#/components/schemas/PunchLocation' }
        flags: { type: array, items: { $ref: '#/components/schemas/PunchFlagSummary' } }
    PunchOutcome:
      type: object
      required: [outcome, punch]
      properties:
        outcome: { type: string, enum: [accepted, flagged] }
        punch: { $ref: '#/components/schemas/PunchRecord' }
    PunchRefusedProblem:
      allOf:
        - $ref: 'common.yaml#/components/schemas/Problem'
        - type: object
          properties:
            rule_ref: { $ref: '#/components/schemas/RuleRef' }
            attempt_id: { $ref: 'common.yaml#/components/schemas/Id' }
    PunchAttempt:
      type: object
      required: [id, source, attempted_at, rule_ref, message]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        employee_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        source: { $ref: '#/components/schemas/PunchSource' }
        device_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        attempted_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        rule_ref: { $ref: '#/components/schemas/RuleRef' }
        message: { type: string }
        location: { $ref: '#/components/schemas/PunchLocation' }
    Device:
      type: object
      required: [id, serial, make, adapter, branch_id, online_state]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        serial: { type: string }
        make: { type: string }
        adapter: { type: string }
        name: { type: [string, 'null'] }
        branch_id: { $ref: 'common.yaml#/components/schemas/Id' }
        online_state: { type: string, enum: [online, offline], description: SM-DEVICE. }
        last_contact_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        offline_alert_sent_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ], description: Set once per offline spell (PC-10, D4). }
        retired_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    EnrolmentMapping:
      type: object
      required: [id, device_id, enrolment_id, employee_id, valid_from, valid_to]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        device_id: { $ref: 'common.yaml#/components/schemas/Id' }
        enrolment_id: { type: string }
        employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
        valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
        valid_to: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Date' }, { type: 'null' } ], description: Inclusive; null = open. }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        created_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
    EnrolmentStatusValue:
      type: string
      enum: [not_enrolled, enrolled, re_enrolment_needed]
    EnrolmentStatus:
      type: object
      required: [employee_id, status, history, mappings]
      properties:
        employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/EnrolmentStatusValue' }
        history:
          type: array
          items:
            type: object
            required: [to_status, effective_at]
            properties:
              from_status: { oneOf: [ { $ref: '#/components/schemas/EnrolmentStatusValue' }, { type: 'null' } ] }
              to_status: { $ref: '#/components/schemas/EnrolmentStatusValue' }
              enrolment_mapping_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
              reason: { type: [string, 'null'] }
              effective_at: { $ref: 'common.yaml#/components/schemas/Instant' }
              created_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        mappings: { type: array, items: { $ref: '#/components/schemas/EnrolmentMapping' } }
    ManualAttendanceRequest:
      type: object
      additionalProperties: false
      required: [branch_id, reason, entries]
      properties:
        branch_id: { $ref: 'common.yaml#/components/schemas/Id' }
        device_id: { $ref: 'common.yaml#/components/schemas/Id', description: The failed device, when known. }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        entries:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [employee_id, event_at]
            properties:
              employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
              event_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    PunchFlag:
      type: object
      required: [id, punch_id, employee_id, reason, state, counts_before_decision, evidence, created_at]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        punch_id: { $ref: 'common.yaml#/components/schemas/Id' }
        employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
        employee_code: { type: string, description: For display (web slice 2). }
        employee_name: { type: string, description: For display (web slice 2). }
        attendance_date: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Date' }, { type: 'null' } ], description: 'The day whose current result uses this punch; null until worked out.' }
        reason: { $ref: '#/components/schemas/FlagReason' }
        state: { type: string, enum: [raised, accepted, rejected] }
        counts_before_decision: { type: boolean, description: DP-05 (E18 - outside fence does not count). }
        evidence: { type: object, additionalProperties: true, description: 'Values that raised the flag (distance, accuracy, delay ...).' }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        decision:
          type: [object, 'null']
          properties:
            decision: { type: string, enum: [accepted, rejected] }
            decided_by: { $ref: 'common.yaml#/components/schemas/Id' }
            on_behalf_of_user_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ], description: Set when decided as a delegate (AC-03). }
            reason: { type: [string, 'null'] }
            decided_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        punch: { $ref: '#/components/schemas/PunchRecord' }
