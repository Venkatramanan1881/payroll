        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/manual-attendance:
    post:
      operationId: timecapRecordManualAttendance
      tags: [Manual attendance]
      summary: Record manual attendance for a device failure
      description: >-
        PC-R9: HR records attendance for the affected employees of one branch on one screen with a reason. Each entry becomes a
        new RawPunch with source = manual, the reason, the entering user and time (BR-01, §16); existing punches are never edited
        and stay visible next to the manual ones (AC-C04-05.6). PC-11 = delegate to Supervisor lets a delegated Supervisor do it for
        that branch, logged under the Supervisor; otherwise Supervisors get 403 (AC-C04-05.3, AC-C04-05.4). One transaction: any
        invalid entry refuses the whole request with field errors (errors[].field = entries[i].…). Blank reason → 422 (AC-C04-05.5).
        Open period: affected days recalculated (BR-03). Locked period: punches are stored, the locked result is unchanged and the
        difference posts to the next open period (SM-ADJ Q1, AC-C04-05.7); older than PL-07 → ADJUSTMENT_WINDOW_EXCEEDED (OQ-C12-04).
        Neutral: the BR-01 approver of an HR-entered manual punch (G-17, OQ-C04-08, DP-08), so manual_approval_ref may be null;
        behaviour when PC-01 "entry by HR" is off (OQ-C04-07). Satisfies AC-C04-05.1..05.7.
      x-permission: TCP-04
      x-module: C04
      x-scope: branch-department
      x-audit: true
      x-events: [PunchRecorded]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualAttendanceRequest' }
