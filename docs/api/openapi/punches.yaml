      tags: [Enrolment]
      summary: Mark an employee as needing re-enrolment
      description: >-
        SM-ENROL N3 Enrolled → Re-enrolment needed (PC-R8). Who or what may set it is OQ-C04-12; this contract offers the manual
        command under TCP-02 only. Whether punches still resolve meanwhile: OQ-C04-12. From not_enrolled → ILLEGAL_TRANSITION;
        repeat → 200 with current status. Satisfies AC-C04-03.3.
      x-permission: TCP-02
      x-module: C04
      x-scope: branch-department
      x-audit: true
      x-events: []
