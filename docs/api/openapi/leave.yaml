    post:
      operationId: leaveBulkDecideRequests
      summary: Approve or reject several leave requests at once
      description: >-
        LM-R3 bulk action: one SM-REQ R4/R5 (or R6) per request, each audited individually with the same actor and
        time (AC-C08-05.4). The batch is not atomic: each item reports its own outcome. Items refused for BR-07
        (AC-C08-05.5), state, scope or balance carry the Problem `code` (SELF_APPROVAL_FORBIDDEN, ILLEGAL_TRANSITION,
        NOT_FOUND, LIMIT_EXCEEDED, ...). AC-03 delegation and locked-date handling as in leaveApproveRequest.
      tags: [Leave requests]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, request_ids]
              properties:
                decision: { type: string, enum: [approve, reject] }
                request_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  uniqueItems: true
                  items: { $ref: 'common.yaml#/components/schemas/Id' }
                comment: { type: string, maxLength: 1000 }
                reason: { type: string, minLength: 1, maxLength: 1000, description: Required when decision = reject. }
      responses:
        '200':
          description: Per-item results.
          content: { application/json: { schema: { $ref: '#/components/schemas/BulkDecisionResult' } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
      x-permission: [LVE-04, LVE-05]
      x-module: C08
      x-scope: team
      x-audit: true
      x-events: [RequestApprovedAtLevel, RequestApproved, AdjustmentPosted]
