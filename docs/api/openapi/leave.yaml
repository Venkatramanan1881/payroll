  /v1/leave/requests/{id}/cancel:
    post:
      operationId: leaveCancelRequest
      summary: Cancel a pending or approved leave request
      description: >-
        SM-REQ R10 (pending) or R11 (approved). Cancelling approved leave posts a reversal ledger entry, never a delete,
        and recalculates open days (AC-C08-06.2, AC-C08-07.1); dates in a locked period are unchanged and the
        difference posts to the next open period tagged with the original date (SM-ADJ Q1, AC-C08-07.2; PL-07 window
        OQ-C12-04). Actor, time and reason are recorded (AC-C08-07.3). Who may cancel (employee, approver, HR), until
        when, and whether cancelling approved leave needs approval is OQ-C08-10 (G-24): role grants stay "?" and this
        contract takes no position; a decided approval step would be additive. Cancel on cancelled → 200;
        on rejected → ILLEGAL_TRANSITION.
      tags: [Leave requests]
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [ { $ref: 'common.yaml#/components/schemas/ReasonRequired' } ]
              unevaluatedProperties: false
      responses:
        '200':
          description: Current state after cancellation.
          content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
      x-permission: LVE-06
      x-module: C08
      x-scope: branch-department
      x-audit: true
