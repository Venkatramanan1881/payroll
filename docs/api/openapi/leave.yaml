  /v1/approvals/pending:
    get:
      operationId: approvalsListPending
      summary: Pending approvals for the caller, all request types
      description: >-
        One inbox over every SM-REQ request type and the other approval aggregates of DOMAIN_MODEL §6, listing items
        currently routed to the caller at their level by AC-02, including items delegated to the caller (AC-03; the
        item carries `on_behalf_of_user_id`). Items the caller raised are never listed (BR-07). Items whose module is
        disabled are omitted (MD-03). Each item gives `request_type` and `request_id`; act on it through that type's
        approve/reject operation. Any role can be a routed approver (PERMISSION_MATRIX P6), so the route is
        AUTHENTICATED and filtered to the caller. `x-module: C03` (approval routing, AC-02/AC-03) is chosen because the
        inbox spans modules. Escalated items: target is OQ-C08-09 / OQ-C09-06; whether delegates also get NT-05/NT-06
        is OQ-C14-09.
      tags: [Approvals]
      parameters:
        - name: request_type
          in: query
          schema: { $ref: '#/components/schemas/ApprovalRequestType' }
        - name: escalated
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [submitted_at, -submitted_at], default: submitted_at }
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of pending items.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [request_type, request_id, level, submitted_at, escalated]
                      properties:
                        request_type: { $ref: '#/components/schemas/ApprovalRequestType' }
                        request_id: { $ref: 'common.yaml#/components/schemas/Id' }
                        level: { type: integer, enum: [1, 2] }
                        employee_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
                        employee_name: { type: [string, 'null'] }
                        requester_user_id: { $ref: 'common.yaml#/components/schemas/Id' }
                        on_behalf_of_user_id:
                          oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ]
                          description: Set when the item reached the caller by delegation (AC-03).
                        summary: { type: string, description: Short localised description, e.g. "Casual leave 12-14 Nov". }
                        submitted_at: { $ref: 'common.yaml#/components/schemas/Instant' }
                        escalated: { type: boolean }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
      x-permission: AUTHENTICATED
      x-module: C03
      x-scope: self
      x-audit: false
      x-events: []
      x-idempotent: n/a

components:
  schemas:
    DecidedBasis:
      type: [string, 'null']
      enum: [approver, auto_on_submit, auto_on_timeout, null]
      description: DB CHECK values (leave_request.decided_basis). Null while pending.
    ApprovalStatus:
      type: object
      required: [state, escalated, submitted_at]
      properties:
        state: { $ref: 'common.yaml#/components/schemas/RequestState' }
        escalated: { type: boolean }
        decided_basis: { $ref: '#/components/schemas/DecidedBasis' }
        current_approver_user_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        submitted_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        cancelled_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        cancelled_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        steps: { type: array, items: { $ref: 'common.yaml#/components/schemas/ApprovalStep' } }
    ApprovalRequestType:
      type: string
      enum: [leave, permission, on_duty, regularisation, comp_off, shift_change, punch_flag, period_unlock, settings_change, opening_balance]
      description: app.approval_step.request_type CHECK values.
    BulkDecisionResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [request_id, outcome]
            properties:
              request_id: { $ref: 'common.yaml#/components/schemas/Id' }
              outcome: { type: string, enum: [done, refused] }
              state: { $ref: 'common.yaml#/components/schemas/RequestState' }
              error: { $ref: 'common.yaml#/components/schemas/Problem' }
    DayPart:
      type: string
      enum: [full, first_half, second_half]
    LeaveRequestInput:
      type: object
      description: Closed by unevaluatedProperties false at each use.
      required: [leave_type_id, from_date, to_date]
      properties:
        leave_type_id: { $ref: 'common.yaml#/components/schemas/Id' }
        from_date: { $ref: 'common.yaml#/components/schemas/Date' }
        to_date: { $ref: 'common.yaml#/components/schemas/Date', description: '>= from_date.' }
        from_part: { allOf: [ { $ref: '#/components/schemas/DayPart' } ], default: full }
        to_part:
          allOf: [ { $ref: '#/components/schemas/DayPart' } ]
          default: full
          description: For a one-day request must equal from_part (DB CHECK).
        reason: { type: string, maxLength: 1000 }
        document: { $ref: 'common.yaml#/components/schemas/FileRef' }
    LeaveRequest:
      allOf:
        - $ref: '#/components/schemas/ApprovalStatus'
        - type: object
          required: [id, employee_id, leave_type_id, from_date, to_date, from_part, to_part, requested_by, days]
          properties:
            id: { $ref: 'common.yaml#/components/schemas/Id' }
            employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
            leave_type_id: { $ref: 'common.yaml#/components/schemas/Id' }
            from_date: { $ref: 'common.yaml#/components/schemas/Date' }
            to_date: { $ref: 'common.yaml#/components/schemas/Date' }
            from_part: { $ref: '#/components/schemas/DayPart' }
            to_part: { $ref: '#/components/schemas/DayPart' }
            reason: { type: [string, 'null'] }
            document_path: { type: [string, 'null'] }
            requested_by: { $ref: 'common.yaml#/components/schemas/Id' }
            days:
              type: array
              items:
                type: object
                required: [leave_date, fraction]
                properties:
                  leave_date: { $ref: 'common.yaml#/components/schemas/Date' }
                  fraction: { type: string, enum: ['0.50', '1.00'] }
                  half: { type: [string, 'null'], enum: [first_half, second_half, null] }
    LeaveType:
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        retired_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        current_version: { $ref: '#/components/schemas/LeaveTypeVersion' }
    LeaveTypeWithVersions:
      allOf:
        - $ref: '#/components/schemas/LeaveType'
        - type: object
          required: [versions]
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/LeaveTypeVersion' } }
    LeaveTypeVersionInput:
      type: object
      additionalProperties: false
      required: [effective_from, reason, paid, eligibility, credit_method, accrual_timing, proration, year_end, negative_allowed_days, half_day_allowed, min_notice_days, approval_levels, timeout_action, during_notice, combine_allowed]
      description: Columns of leave.leave_type_version (LM-01..LM-15). Days are DayQuantity strings.
      properties:
        effective_from: { $ref: 'common.yaml#/components/schemas/Date' }
        reason: { type: string, minLength: 1, maxLength: 1000, description: G9 change reason. }
        paid: { type: boolean, description: LM-R1 }
        eligibility:
          type: object
          description: LM-01 category / employee type / after probation. Payroll group is OQ-C08-01.
          additionalProperties: false
          properties:
            category_ids: { type: array, items: { $ref: 'common.yaml#/components/schemas/Id' } }
            employee_type_ids: { type: array, items: { $ref: 'common.yaml#/components/schemas/Id' } }
            after_probation: { type: boolean }
        credit_method: { type: string, enum: [annual_grant, monthly_accrual, quarterly_accrual, earned_by_days_worked], description: LM-02 }
        credit_days: { $ref: 'common.yaml#/components/schemas/DayQuantity' }
        earn_per_worked_days: { type: integer, minimum: 1, description: Required iff credit_method = earned_by_days_worked (OQ-C08-04). }
        accrual_timing: { type: string, enum: [start, end], description: LM-03 }
        proration: { type: string, enum: [prorated, full, none], description: LM-04 (formula OQ-C08-03) }
        max_balance: { $ref: 'common.yaml#/components/schemas/DayQuantity', description: LM-05 }
        year_end: { type: string, enum: [carry_forward, lapse, encash], description: LM-06 (encash in V1 OQ-C08-05) }
        carry_forward_max: { $ref: 'common.yaml#/components/schemas/DayQuantity' }
        negative_allowed_days: { $ref: 'common.yaml#/components/schemas/DayQuantity', description: LM-07 }
        half_day_allowed: { type: boolean, description: LM-08 }
        min_notice_days: { type: integer, minimum: 0, description: LM-09 }
        max_consecutive_days: { $ref: 'common.yaml#/components/schemas/DayQuantity', description: LM-10 }
        after_event_days: { type: integer, minimum: 0, description: 'LM-11; null = not allowed.' }
        document_after_days: { $ref: 'common.yaml#/components/schemas/DayQuantity', description: LM-12 }
        approval_levels: { type: string, enum: [manager, manager_then_hr], description: LM-13 }
        timeout_action: { type: string, enum: [escalate, auto_approve, auto_reject], description: LM-13 }
        timeout_days: { type: integer, minimum: 1 }
        combine_allowed: { type: boolean, description: LM-14 }
        during_notice: { type: string, enum: [allow, block, extend_notice], description: LM-15 (extend OQ-C08-07) }
    LeaveTypeVersion:
      type: object
      required: [id, leave_type_id, effective_from]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        leave_type_id: { $ref: 'common.yaml#/components/schemas/Id' }
        effective_from: { $ref: 'common.yaml#/components/schemas/Date' }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        created_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        settings:
          type: object
          description: The version's LM settings, same fields as LeaveTypeVersionInput.
          additionalProperties: true
    LedgerEntryKind:
      type: string
      enum: [opening, accrual, grant, debit, reversal, sandwich_debit, penalty_debit, absence_auto_debit, carry_forward, lapse, encashment, adjustment]
    LeaveLedgerEntry:
      type: object
      required: [id, account_id, leave_type_id, entry_date, entry_kind, quantity, cause_kind, cause_id, created_at]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        account_id: { $ref: 'common.yaml#/components/schemas/Id' }
        leave_type_id: { $ref: 'common.yaml#/components/schemas/Id' }
        entry_date: { $ref: 'common.yaml#/components/schemas/Date' }
        entry_kind: { $ref: '#/components/schemas/LedgerEntryKind' }
        quantity: { $ref: 'common.yaml#/components/schemas/DayQuantity' }
        cause_kind: { type: string, description: 'e.g. leave_request, period_penalty, day_result, opening_balance_entry, accrual_run.' }
        cause_id: { $ref: 'common.yaml#/components/schemas/Id' }
        reason: { type: [string, 'null'] }
        reverses_entry_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        created_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
    AbscondingState:
      type: string
      enum: [open, closed_returned, closed_offboarding]
    AbscondingCase:
      type: object
      required: [id, employee_id, state, opened_on, trigger_days, pay_hold]
      properties:
