      description: >-
        SM-REQ R6 with a mandatory reason; no ledger entry (AC-C08-05.3). BR-07 → SELF_APPROVAL_FORBIDDEN, including
        a delegate acting on their own request (AC-C08-05.5); AC-03 delegate recorded (AC-C08-05.7). Reject on
        rejected → 200 current state; on approved/cancelled → ILLEGAL_TRANSITION.
