    post:
      operationId: schedSubmitShiftChangeRequest
      tags: [Shift change requests]
      summary: Request a shift change or swap
      description: >-
        SH-12, SM-REQ R1: the employee asks for another shift on a date (kind change, requested_shift_id) or a swap with a colleague
        (kind swap, swap_with_employee_id). Routed to the approver from AC-02 (ShiftChangeRequest, one level per SM-REQ §8.2); the roster
        is unchanged until approved (AC-C05-08.2). SH-12 off → RULE_GROUP_DISABLED (AC-C05-08.1). NT-05 on submit (AC-C05-08.5).
        Swap consent by the colleague, approver when the two have different approvers, and timeout: G-21 / OQ-C05-12 (neutral).
        Draft state and withdraw: GAP-SM-08. Satisfies AC-C05-08.1, AC-C05-08.2, AC-C05-08.5.
      x-permission: SCH-07
      x-module: C05
      x-scope: self
      x-audit: true
      x-events: [RequestSubmitted]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, roster_date]
              properties:
                kind: { type: string, enum: [change, swap] }
                roster_date: { $ref: 'common.yaml#/components/schemas/Date' }
                requested_shift_id: { $ref: 'common.yaml#/components/schemas/Id', description: Required for kind = change. }
                swap_with_employee_id: { $ref: 'common.yaml#/components/schemas/Id', description: Required for kind = swap; not the requester. }
                reason: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Request submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftChangeRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
    get:
      operationId: schedListMyShiftChangeRequests
      tags: [Shift change requests]
      summary: My shift change requests
      description: Own requests with state and approval steps (SH-12, SM-REQ).
      x-permission: SCH-07
      x-module: C05
      x-scope: self
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - { name: state, in: query, schema: { $ref: 'common.yaml#/components/schemas/RequestState' } }
      responses:
        '200':
          description: Page of requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ShiftChangeRequest' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /v1/shift-change-requests:
    get:
      operationId: schedListShiftChangeRequests
      tags: [Shift change requests]
      summary: Shift change requests to decide
      description: Requests routed to the caller (AC-02) or delegated to them (AC-03), default pending (SM-REQ). Satisfies AC-C05-08.2.
      x-permission: SCH-08
      x-module: C05
      x-scope: team
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - { name: state, in: query, schema: { $ref: 'common.yaml#/components/schemas/RequestState' } }
        - { name: employee_id, in: query, schema: { $ref: 'common.yaml#/components/schemas/Id' } }
        - $ref: 'common.yaml#/components/parameters/From'
        - $ref: 'common.yaml#/components/parameters/To'
      responses:
        '200':
          description: Page of requests.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ShiftChangeRequest' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /v1/shift-change-requests/{id}:
    get:
      operationId: schedGetShiftChangeRequest
      tags: [Shift change requests]
      summary: Get a shift change request
      description: Request with approval steps (SM-REQ, §16).
      x-permission: SCH-08
      x-module: C05
      x-scope: team
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftChangeRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
  /v1/shift-change-requests/{id}/approve:
    post:
      operationId: schedApproveShiftChangeRequest
      tags: [Shift change requests]
      summary: Approve a shift change request
      description: >-
        SM-REQ R5: pending → approved. The roster for the date changes (change: requested shift; swap: both employees' entries), logged
        with approver and time; affected open days recalculated (AC-C05-08.3, BR-03); locked date → difference posts to the next open
        period (SM-ADJ). SELF_APPROVAL_FORBIDDEN (403) when the approver is the requester, including when acting as an AC-03 delegate
        (BR-07, AC-C05-08.4). Approve on approved → 200 with current state, no second roster change; on rejected/cancelled →
        ILLEGAL_TRANSITION. Swap approver when the two have different approvers: G-21 / OQ-C05-12. Satisfies AC-C05-08.3..08.5.
      x-permission: SCH-08
      x-module: C05
      x-scope: team
      x-audit: true
      x-events: [RequestApproved, RosterChanged]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Request approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftChangeRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
  /v1/shift-change-requests/{id}/reject:
    post:
      operationId: schedRejectShiftChangeRequest
      tags: [Shift change requests]
      summary: Reject a shift change request
      description: >-
        SM-REQ R6: pending → rejected with a reason; roster unchanged; NT-05 to the requester (AC-C05-08.5). SELF_APPROVAL_FORBIDDEN
        including the AC-03 delegate case (BR-07). Reject on rejected → 200; on approved/cancelled → ILLEGAL_TRANSITION.
        Cancellation of shift change requests is not in the BRD (GAP-SM-09) and has no operation here.
      x-permission: SCH-08
      x-module: C05
      x-scope: team
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/RejectionDecision' }
      responses:
        '200':
          description: Request rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftChangeRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

components:
  schemas:
    VersionState:
      type: string
      enum: [draft, pending_approval, scheduled, in_force, superseded]
      description: SM-POLICYVER states, reused for shift versions.
    ShiftDefinition:
      type: object
      additionalProperties: false
      description: Shift shape (SH-01..SH-07, SH-11). Fields left out keep the default or the copied value.
      properties:
        shift_type: { type: string, enum: [fixed, flexible, flexible_core, split, night, open], default: fixed }
        start_time: { oneOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' }, { type: 'null' } ] }
        end_time: { oneOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' }, { type: 'null' } ] }
        required_minutes: { type: [integer, 'null'], minimum: 1 }
        required_per: { type: string, enum: [day, week], default: day, description: 'Week starts on OR-02 (AC-C05-01.5).' }
        core_start: { oneOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' }, { type: 'null' } ] }
        core_end: { oneOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' }, { type: 'null' } ] }
        flex_earliest_in: { oneOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' }, { type: 'null' } ] }
        flex_latest_out: { oneOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' }, { type: 'null' } ] }
        window_before_min: { type: integer, minimum: 0, default: 180 }
        window_after_min: { type: integer, minimum: 0, default: 360 }
        is_night_shift: { type: boolean, default: false, description: What marks a night shift is OQ-C05-02. }
        night_attendance_date: { type: string, enum: [shift_start_date, shift_end_date], default: shift_start_date }
        half_day_split: { type: string, enum: [middle_of_shift, fixed_time], default: middle_of_shift }
        missed_punch_cutoff:
          allOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' } ]
          default: '02:30'
          description: 'D-08. An unresolved missed punch gets its MP-03 outcome at this time on the day after the shift end date, in the branch''s zone. Example: shift ends Mon 18:00 -> Tue 02:30; night shift ends Tue 06:00 -> Wed 02:30.'
        half_day_split_time: { oneOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' }, { type: 'null' } ] }
        segments:
          type: [array, 'null']
          description: Split shifts only; shape is OQ-C05-01, so items are kept open.
          items: { type: object, additionalProperties: true }
    ShiftVersion:
      allOf:
        - $ref: '#/components/schemas/ShiftDefinition'
        - type: object
          required: [id, shift_id, effective_from, state]
          properties:
            id: { $ref: 'common.yaml#/components/schemas/Id' }
            shift_id: { $ref: 'common.yaml#/components/schemas/Id' }
            effective_from: { $ref: 'common.yaml#/components/schemas/Date' }
            state: { $ref: '#/components/schemas/VersionState' }
            crosses_midnight: { type: [boolean, 'null'], description: Derived (end before start). }
            reason: { type: [string, 'null'] }
            updated_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    Shift:
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        retired_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        current_version: { oneOf: [ { $ref: '#/components/schemas/ShiftVersion' }, { type: 'null' } ] }
        versions: { type: array, items: { $ref: '#/components/schemas/ShiftVersion' } }
    EmployeeSchedule:
      type: object
      required: [id, employee_id, source, valid_from, valid_to]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
        source: { type: string, enum: [fixed_shift, roster] }
        shift_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        weekly_off_pattern_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
        valid_to: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Date' }, { type: 'null' } ], description: Inclusive; null = open. }
        reason: { type: [string, 'null'] }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        created_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
    RosterEntry:
      type: object
      required: [id, employee_id, roster_date, is_weekly_off, source]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
        roster_date: { $ref: 'common.yaml#/components/schemas/Date' }
        is_weekly_off: { type: boolean }
        shift_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        shift_version_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        shift_code: { type: [string, 'null'] }
        source: { type: string, enum: [screen, upload, copy, rotation] }
        updated_at: { $ref: 'common.yaml#/components/schemas/Instant' }
        updated_by: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
    EmployeeSelection:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: Exactly one of employee_ids, branch_id or department_id ("team" is undefined, G-15). Applied within scope.
      properties:
        employee_ids: { type: array, minItems: 1, maxItems: 500, items: { $ref: 'common.yaml#/components/schemas/Id' } }
        branch_id: { $ref: 'common.yaml#/components/schemas/Id' }
        department_id: { $ref: 'common.yaml#/components/schemas/Id' }
    ScheduleDay:
      type: object
      required: [date, source, is_weekly_off]
      properties:
        date: { $ref: 'common.yaml#/components/schemas/Date' }
        source: { type: string, enum: [roster, fixed_shift, none] }
        shift_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
        shift_code: { type: [string, 'null'] }
        shift_name: { type: [string, 'null'] }
        start_time: { oneOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' }, { type: 'null' } ] }
        end_time: { oneOf: [ { $ref: 'common.yaml#/components/schemas/TimeOfDay' }, { type: 'null' } ] }
        is_weekly_off: { type: boolean }
        holiday_name: { type: [string, 'null'] }
    WeeklyOffPattern:
      type: object
      required: [id, name, kind]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        name: { type: string }
        kind: { type: string, enum: [fixed_days, alternating, from_roster] }
        weekly_days: { type: [array, 'null'], items: { type: integer, minimum: 1, maximum: 7 } }
        alt_day: { type: [integer, 'null'], minimum: 1, maximum: 7 }
        alt_weeks: { type: [array, 'null'], items: { type: integer, minimum: 1, maximum: 5 } }
        retired_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
    HolidayKind:
      type: string
      enum: [national, festival, optional]
    HolidayCalendar:
      type: object
      required: [id, name]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        name: { type: string }
        retired_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
        branch_ids: { type: array, items: { $ref: 'common.yaml#/components/schemas/Id' }, description: Branches pointing at this calendar. }
    Holiday:
      type: object
      required: [id, calendar_id, holiday_date, name, kind]
      properties:
        id: { $ref: 'common.yaml#/components/schemas/Id' }
        calendar_id: { $ref: 'common.yaml#/components/schemas/Id' }
        holiday_date: { $ref: 'common.yaml#/components/schemas/Date' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/HolidayKind' }
        updated_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    OptionalHolidayChoice:
      type: object
      required: [employee_id, holiday_id, created_at]
      properties:
        employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
        holiday_id: { $ref: 'common.yaml#/components/schemas/Id' }
        holiday_date: { $ref: 'common.yaml#/components/schemas/Date' }
        created_at: { $ref: 'common.yaml#/components/schemas/Instant' }
    ShiftChangeRequest:
      allOf:
        - $ref: 'common.yaml#/components/schemas/RequestSummary'
        - type: object
          required: [id, employee_id, kind, roster_date, approval_steps]
          properties:
            id: { $ref: 'common.yaml#/components/schemas/Id' }
            employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
            kind: { type: string, enum: [change, swap] }
            roster_date: { $ref: 'common.yaml#/components/schemas/Date' }
            requested_shift_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
            requested_shift_version_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
            swap_with_employee_id: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Id' }, { type: 'null' } ] }
            reason: { type: [string, 'null'] }
            decided_at: { oneOf: [ { $ref: 'common.yaml#/components/schemas/Instant' }, { type: 'null' } ] }
            approval_steps: { type: array, items: { $ref: 'common.yaml#/components/schemas/ApprovalStep' } }
