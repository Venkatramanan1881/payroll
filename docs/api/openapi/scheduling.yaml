openapi: 3.1.0
info:
  title: Payroll App API - Scheduling (shifts, rosters, weekly offs, holidays)
  version: 1.0.0-draft
  description: >-
    Scheduling context (DOMAIN_MODEL §3.6), BRD modules C05 Shifts and roster (SH-R1..SH-R4, SH-01..SH-12) and C07 Holidays and
    weekly offs (HD-R1..HD-R3, HD-01, SH-09, SH-10), with G5, G9, BR-03, BR-05, BR-06, BR-07. Shifts are versioned (G5; shift
    versions reuse the SM-POLICYVER states), rosters are dated entries, shift change and swap requests follow SM-REQ.
    Changes touching dates in a locked period never change the locked result: the difference posts to the next open period
    (SM-ADJ Q1); older than PL-07 is ADJUSTMENT_WINDOW_EXCEEDED (outcome OQ-C12-04).
security:
  - userToken: []
tags:
  - name: Shifts
    description: Shifts and shift versions (SH-R1, SH-01..SH-08, SH-11, G5).
  - name: Schedules
    description: Employee schedule assignment (fixed shift or roster) and roster entries (SH-R2..SH-R4, EM-R3).
  - name: Weekly offs
    description: Weekly-off patterns (SH-09, HD-R2).
  - name: Holidays
    description: Holiday calendars, holidays and optional-holiday choices (HD-R1, HD-R3, SH-10, HD-01).
  - name: Shift change requests
    description: Shift change and swap requests (SH-12, SM-REQ).
paths:
  /v1/shifts:
    post:
      operationId: schedCreateShift
      tags: [Shifts]
      summary: Create a shift with its first draft version
      description: >-
        Creates a Shift (code unique in the organisation) and its first version in state draft (SH-R1, SH-01). Unset fields take the
        BRD defaults: fixed 09:00-18:00, 480 required minutes per day, window 180 before / 360 after, half-day split at the middle
        (SH-01..SH-03, SH-07, SH-11, AC-C05-01.1). Type rules are checked as field errors: flexible_core needs core_start/core_end
        (AC-C05-01.2), open has no start/end and needs required_minutes (AC-C05-01.4), fixed/night need start/end, segments only for
        split (shape OQ-C05-01), night marker OQ-C05-02. Publish with schedPublishShiftVersion. Satisfies AC-C05-01.1..01.5, AC-C05-01.8.
      x-permission: SCH-01
      x-module: C05
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, effective_from]
              properties:
                code: { type: string, minLength: 1, maxLength: 20 }
                name: { type: string, minLength: 1, maxLength: 120 }
                effective_from: { $ref: 'common.yaml#/components/schemas/Date' }
                definition: { $ref: '#/components/schemas/ShiftDefinition' }
      responses:
        '201':
          description: Shift created with a draft version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
    get:
      operationId: schedListShifts
      tags: [Shifts]
      summary: List shifts
      description: Shifts with the version in force on `on_date` (default today) (SH-R1, BR-05). Read by roster viewers (SCH-03).
      x-permission: SCH-03
      x-module: C05
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - { name: on_date, in: query, schema: { $ref: 'common.yaml#/components/schemas/Date' } }
        - { name: include_retired, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Page of shifts.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Shift' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /v1/shifts/{id}:
    get:
      operationId: schedGetShift
      tags: [Shifts]
      summary: Get a shift with all its versions
      description: Shift and its versions with states and effective dates (G5, G9 history). Satisfies AC-C05-01.7 (read side).
      x-permission: SCH-03
      x-module: C05
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
      responses:
        '200':
          description: The shift.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
  /v1/shifts/{id}/versions:
    post:
      operationId: schedCreateShiftVersion
      tags: [Shifts]
      summary: Start a new draft version of a shift
      description: >-
        G5: a version in use is never edited; a change is a new draft version, copied from the version in force (or the latest)
        and overlaid with the given fields, with its own effective_from (AC-C05-01.7). Satisfies AC-C05-01.7.
      x-permission: SCH-01
      x-module: C05
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [effective_from]
              properties:
                effective_from: { $ref: 'common.yaml#/components/schemas/Date' }
                definition: { $ref: '#/components/schemas/ShiftDefinition' }
      responses:
        '201':
          description: Draft version created.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftVersion' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
  /v1/shift-versions/{id}:
    get:
      operationId: schedGetShiftVersion
      tags: [Shifts]
      summary: Get a shift version
      description: One shift version with its ETag (G5).
      x-permission: SCH-03
      x-module: C05
      x-scope: org
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
      responses:
        '200':
          description: The version.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftVersion' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
    patch:
      operationId: schedUpdateShiftVersion
      tags: [Shifts]
      summary: Edit a draft shift version
      description: >-
        Edits a draft only. A version in state pending_approval, scheduled, in_force or superseded returns VERSION_FROZEN (G5;
        editing a scheduled version is GAP-SM-16). Same type rules as schedCreateShift. Satisfies AC-C05-01.2, AC-C05-01.7.
      x-permission: SCH-01
      x-module: C05
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: natural
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                effective_from: { $ref: 'common.yaml#/components/schemas/Date' }
                definition: { $ref: '#/components/schemas/ShiftDefinition' }
      responses:
        '200':
          description: Updated draft.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftVersion' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
  /v1/shift-versions/{id}/publish:
    post:
      operationId: schedPublishShiftVersion
      tags: [Shifts]
      summary: Publish a draft shift version
      description: >-
        Draft → scheduled or in_force by effective_from (SM-POLICYVER V3), or → pending_approval when AC-04 = with Organisation Admin
        approval and AC-04 covers shifts (V4; coverage is G-08 / OQ-C03-11). Reason required (G9). Two non-draft versions of one
        shift with the same effective_from → ILLEGAL_TRANSITION. In force on open dates → affected days recalculated (BR-03);
        back-dated into a locked period → GAP-SM-16 (neutral; if allowed, differences post as adjustments, SM-ADJ).
        Repeat on a published version → 200 with current state. Satisfies AC-C05-01.7, AC-C05-01.8.
      x-permission: SCH-01
      x-module: C05
      x-scope: org
      x-audit: true
      x-events: [RosterChanged]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/ReasonRequired' }
      responses:
        '200':
          description: Version published or submitted for approval.
          headers: { ETag: { $ref: 'common.yaml#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftVersion' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
  /v1/shift-versions/{id}/approve:
    post:
      operationId: schedApproveShiftVersion
      tags: [Shifts]
      summary: Approve a shift version pending AC-04 approval
      description: >-
        pending_approval → scheduled or in_force (SM-POLICYVER V5 applied to shifts). Only reachable when AC-04 covers shifts (G-08);
        the approver role for shifts is not in the matrix (SCH-01 has no OA cell; G-08 / OQ-C03-11), so the grant is configured on SCH-01.
        SELF_APPROVAL_FORBIDDEN when the approver submitted the version, also when acting as an AC-03 delegate (BR-07).
        From any other state → ILLEGAL_TRANSITION; repeat → 200 with current state.
      x-permission: SCH-01
      x-module: C05
      x-scope: org
      x-audit: true
      x-events: [RosterChanged]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Version approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftVersion' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
  /v1/shift-versions/{id}/reject:
    post:
      operationId: schedRejectShiftVersion
      tags: [Shifts]
      summary: Reject a shift version pending AC-04 approval
      description: >-
        Rejects a pending_approval version with a reason; the version in force is unchanged (AC-C03-09.4). The resulting state of the
        rejected version is GAP-SM-16 (the response shows whatever state the server records). Same approver and BR-07 / AC-03 rules as
        schedApproveShiftVersion (G-08).
      x-permission: SCH-01
      x-module: C05
      x-scope: org
      x-audit: true
      x-events: []
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/Id'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'common.yaml#/components/schemas/RejectionDecision' }
      responses:
        '200':
          description: Version rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftVersion' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }

  /v1/employee-schedules:
    post:
      operationId: schedAssignEmployeeSchedule
      tags: [Schedules]
      summary: Assign a fixed shift or roster to an employee from a date
      description: >-
        EM-R3: an employee follows a fixed shift or a roster, with a weekly-off pattern (SH-09), from valid_from. The current
        assignment is ended the day before; history is kept with who and reason (EM-R6, G9, AC-C05-03.2). source = fixed_shift needs
        shift_id; source = roster must not have one. Open-period dates recalculated (BR-03, AC-C05-03.3); locked dates → adjustment
        (SM-ADJ, AC-C05-03.4). Employee must be in scope (AC-07, AC-C05-03.7). MGR/SUP rights: G-19. Shift-level policy assignment
        vs own shift: OQ-C05-07. Satisfies AC-C05-03.2..03.4, AC-C05-03.7, AC-C05-03.8.
      x-permission: SCH-02
      x-module: C05
      x-scope: branch-department
      x-audit: true
      x-events: [RosterChanged]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employee_id, source, valid_from, reason]
              properties:
                employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
                source: { type: string, enum: [fixed_shift, roster] }
                shift_id: { $ref: 'common.yaml#/components/schemas/Id' }
                weekly_off_pattern_id: { $ref: 'common.yaml#/components/schemas/Id' }
                valid_from: { $ref: 'common.yaml#/components/schemas/Date' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeSchedule' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
    get:
      operationId: schedListEmployeeSchedules
      tags: [Schedules]
      summary: List employee schedule assignments
      description: Dated assignments (fixed shift or roster, weekly-off pattern) with history (EM-R6). Satisfies AC-C05-03.2 (read side).
      x-permission: SCH-03
      x-module: C05
      x-scope: branch-department
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - { name: employee_id, in: query, schema: { $ref: 'common.yaml#/components/schemas/Id' } }
        - $ref: 'common.yaml#/components/parameters/BranchFilter'
        - $ref: 'common.yaml#/components/parameters/DepartmentFilter'
        - { name: on_date, in: query, schema: { $ref: 'common.yaml#/components/schemas/Date' } }
      responses:
        '200':
          description: Page of assignments.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EmployeeSchedule' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /v1/roster-entries:
    get:
      operationId: schedListRosterEntries
      tags: [Schedules]
      summary: List roster entries
      description: >-
        Roster entries (employee, date, shift version or weekly off, source) in scope (SH-R2). Supervisor reads for their team
        (DB-R6; team definition G-15); OA/MGR/AUD reads G-14. Satisfies AC-C05-03.1, AC-C05-03.7, AC-C05-03.8, AC-C05-06.3.
      x-permission: SCH-03
      x-module: C05
      x-scope: branch-department
      x-audit: false
      x-events: []
      x-idempotent: n/a
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - { name: employee_id, in: query, schema: { $ref: 'common.yaml#/components/schemas/Id' } }
        - $ref: 'common.yaml#/components/parameters/BranchFilter'
        - $ref: 'common.yaml#/components/parameters/DepartmentFilter'
        - { name: from, in: query, required: true, schema: { $ref: 'common.yaml#/components/schemas/Date' } }
        - { name: to, in: query, required: true, schema: { $ref: 'common.yaml#/components/schemas/Date' } }
      responses:
        '200':
          description: Page of entries ordered by employee, date.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RosterEntry' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
  /v1/roster-entries/set:
    post:
      operationId: schedSetRosterEntries
      tags: [Schedules]
      summary: Set roster entries from the roster screen
      description: >-
        SH-R2 by screen: sets one entry per employee and date (a shift, or a weekly off), replacing the entry for that date. The
        client names the shift; the server stores the shift version in force on the date (BR-05). One transaction: any invalid row
        (employee outside scope, unknown shift) refuses the whole request with field errors entries[i].… (AC-C05-03.7).
        One shift per employee per date (more than one: OQ-C05-06). Open dates recalculated (BR-03); locked dates → adjustment
        (SM-ADJ, AC-C05-03.4). Roster publication and change notification: OQ-C05-10. MGR/SUP rights: G-19.
        Satisfies AC-C05-03.1, AC-C05-03.3, AC-C05-03.4, AC-C05-03.7, AC-C05-03.8, AC-C07-02.3.
      x-permission: SCH-02
      x-module: C05
      x-scope: branch-department
      x-audit: true
      x-events: [RosterChanged]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entries]
              properties:
                reason: { type: string, maxLength: 1000 }
                entries:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    required: [employee_id, roster_date, is_weekly_off]
                    properties:
                      employee_id: { $ref: 'common.yaml#/components/schemas/Id' }
                      roster_date: { $ref: 'common.yaml#/components/schemas/Date' }
                      is_weekly_off: { type: boolean }
                      shift_id: { $ref: 'common.yaml#/components/schemas/Id', description: Required when is_weekly_off is false; absent otherwise. }
      responses:
        '200':
          description: Entries as stored.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/RosterEntry' } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
  /v1/roster-uploads:
    post:
      operationId: schedUploadRoster
      tags: [Schedules]
      summary: Upload a roster spreadsheet (job)
      description: >-
        SH-R2 by spreadsheet. The file is uploaded through an upload link first (API_CONVENTIONS §7); this starts a job (202) that
        applies rows exactly as in the file (AC-C05-04.1). Rows naming employees outside scope or organisation are never applied
        (AC-C05-04.2). Whether invalid rows reject the whole file or valid rows are applied with an error report (Job.error_report_url)
        is OQ-C05-08 (neutral). Recalculation and lock handling as schedSetRosterEntries (BR-03, SM-ADJ). File type rules:
        FILE_TYPE_NOT_ALLOWED. Satisfies AC-C05-04.1..04.3.
      x-permission: SCH-02
      x-module: C05
      x-scope: branch-department
      x-audit: true
      x-events: [RosterChanged]
      x-idempotent: key
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { $ref: 'common.yaml#/components/schemas/FileRef' }
                reason: { type: string, maxLength: 1000 }
      responses:
        '202': { $ref: 'common.yaml#/components/responses/Accepted' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: 'common.yaml#/components/responses/PreconditionRequired' }
